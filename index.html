<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 아이 체크리스트</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--tx:#2b2a33;--mut:#7a7686;--bd:#eadfc9;--ac:#ff8a3d;--ok:#35b26b;--c0:#ffe1d6;--c1:#dcefff;--c2:#e4f6d9;--c3:#f0e1ff;--c4:#fff1bf;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--card:#2a2733;--tx:#f2eff8;--mut:#a29cb3;--bd:#3d3948;--ac:#ff9a55;--ok:#4cc882;--c0:#4a2f28;--c1:#27384a;--c2:#2d4125;--c3:#3d2d4f;--c4:#4a4122;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:22px;margin:0}.date{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.lock{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:8px 14px;font-size:14px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:12px;border-radius:14px;border:2px solid var(--bd);background:var(--card);font-weight:700}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.prog{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--bd)}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.cat{border-radius:18px;padding:12px;margin-top:14px}
.cat h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px;margin-top:8px;text-align:left;font-size:17px}
.box{width:30px;height:30px;border-radius:10px;border:3px solid var(--bd);display:grid;place-items:center;flex:none;font-size:20px;color:#fff}
.item.done{opacity:.75}.item.done .box{background:var(--ok);border-color:var(--ok)}
.item.done .t{text-decoration:line-through}
.calh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:800;font-size:18px}.calh button{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{text-align:center;font-size:13px;color:var(--mut)}
.cd{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.cd.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}.cd.today{outline:3px solid var(--ac)}.cd.blank{background:transparent;border:0}.cd small{font-size:14px;line-height:1}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.g{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px}.g.full{border-color:var(--ok)}
.gt{font-weight:700;font-size:14px}.gn{font-size:28px;font-weight:800;margin-top:4px}.gn small{font-size:15px;color:var(--mut)}.g .date{margin-top:4px}
.row{display:flex;gap:8px;margin-top:8px}.row .item{margin-top:0}
.x{border:0;background:transparent;font-size:14px;color:var(--mut);padding:6px 10px}
.x.arm{color:#d33;font-weight:700}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%}
.add{display:flex;gap:8px;margin-top:8px}.add button,.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700;white-space:nowrap}
.edit{background:var(--card);border:2px dashed var(--ac);border-radius:14px;padding:12px;margin-top:14px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.cheer{text-align:center;font-size:20px;font-weight:800;color:var(--ok);margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:20}
.modal div{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:320px;text-align:center}
.modal input{text-align:center;font-size:24px;letter-spacing:8px;margin:12px 0}
.err{color:#d33;font-size:14px;min-height:20px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;margin-top:8px}
</style></head><body><main id="app"></main>
<script>
const KEY='kidcheck_v1';
let S={pin:null,cats:[],items:[],checks:{}},unlocked=false,tab='daily',modal=null,err='',armed=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.days)S.days={};let calY=new Date().getFullYear(),calM=new Date().getMonth();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function daySections(){const nm=['일','월','화','수','목','금','토'],td=new Date(),tk=dk(td);
 const row=(x,dt)=>{const ds=dk(dt),d=(S.checks['d'+ds]||[]).includes(x.id),fut=ds>tk;return `<div class="row"><button class="item ${d?'done':''}" ${fut?'disabled style="opacity:.45"':''} data-a="chk" data-v="${x.id}" data-d="${ds}"><span class="box">${d?'✓':''}</span><span class="t">${esc(x.text)}</span></button>${unlocked?`<button class="x" data-a="delit" data-v="${x.id}">✕</button>`:''}</div>`};
 if(tab==='daily'){const it=S.items.filter(i=>i.type==='weekday'&&i.dow===td.getDay());return it.length?`<section class="cat" style="background:var(--c4)"><h2>📆 ${nm[td.getDay()]}요일 할 일</h2>${it.map(x=>row(x,td)).join('')}</section>`:''}
 if(tab!=='weekly')return '';
 const m=monday();let o='';
 for(let i=0;i<7;i++){const dt=new Date(m);dt.setDate(m.getDate()+i);const w=(i+1)%7,it=S.items.filter(x=>x.type==='weekday'&&x.dow===w),isT=dk(dt)===tk;
  o+=`<section class="cat" style="background:var(--c${i%5});${isT?'outline:3px solid var(--ac)':''}"><h2>${nm[w]}요일 <span class="date">${dt.getMonth()+1}/${dt.getDate()}${isT?' · 오늘':''}</span></h2>${it.map(x=>row(x,dt)).join('')}${unlocked?`<div class="add"><input id="nw-${w}" placeholder="${nm[w]}요일 할 일 추가" maxlength="40"><button data-a="addwd" data-v="${w}">추가</button></div>`:''}${!it.length&&!unlocked?'<div class="date">할 일 없음</div>':''}</section>`}
 return o}
function gauges(){const g=(t,l,k)=>{let n=0,tot=0;if(t==='daily'){const it=todayItems(),d=S.checks[k]||[];tot=it.length;n=it.filter(i=>d.includes(i.id)).length}else{const m=monday();for(let j=0;j<7;j++){const dt=new Date(m);dt.setDate(m.getDate()+j);const d=S.checks['d'+dk(dt)]||[];S.items.filter(i=>i.type==='weekday'&&i.dow===dt.getDay()).forEach(i=>{tot++;if(d.includes(i.id))n++})}}const it={length:tot},p=it.length?Math.round(n/it.length*100):0;return `<div class="g${n&&n===it.length?' full':''}"><div class="gt">${l}</div><div class="gn">${n}<small>/${it.length}</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="date">${p}%${n&&n===it.length?' 🎉':''}</div></div>`};
 return `<div class="gs">${g('daily','☀️ 오늘 할 일','d'+dk(new Date()))}${g('weekly','📅 이번 주 할 일','w'+dk(monday()))}</div>`}
function todayItems(dt){dt=dt||new Date();return S.items.filter(i=>i.type==='daily'||(i.type==='weekday'&&i.dow===dt.getDay()))}
function mark(dt){dt=dt||new Date();const t=dk(dt),d=S.checks['d'+t]||[],it=todayItems(dt),ok=it.length>0&&it.every(i=>d.includes(i.id));if(ok!==!!S.days[t]){ok?S.days[t]=1:delete S.days[t];save()}}
function calHtml(){const f=new Date(calY,calM,1),dn=new Date(calY,calM+1,0).getDate(),t=dk(new Date());let c=0,g='';
 for(let i=0;i<f.getDay();i++)g+='<div class="cd blank"></div>';
 for(let d=1;d<=dn;d++){const s=calY+'-'+pad(calM+1)+'-'+pad(d),ok=S.days[s];if(ok)c++;g+=`<div class="cd ${ok?'ok':''} ${s===t?'today':''}"><small>${ok?'✅':''}</small>${d}</div>`}
 return `<div class="calh"><button data-a="cprev">◀</button><span>${calY}년 ${calM+1}월</span><button data-a="cnext">▶</button></div><div class="prog"><b>이번 달 ${c}일 달성</b> <span class="date">매일 항목을 모두 체크한 날</span></div><div class="cal" style="margin-top:10px">${['일','월','화','수','목','금','토'].map(x=>`<b>${x}</b>`).join('')}${g}</div>`}
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const key=()=>tab==='daily'?'d'+dk(new Date()):'w'+dk(monday());
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=p=>btoa(unescape(encodeURIComponent('kc:'+p)));
const uid=()=>Math.random().toString(36).slice(2,9);
function render(){
  mark();const k=key(),done=S.checks[k]||[],its=tab==='daily'?todayItems():[];
  const n=its.filter(i=>done.includes(i.id)).length,pct=its.length?Math.round(n/its.length*100):0;
  const now=new Date(),w=['일','월','화','수','목','금','토'][now.getDay()];
  let h=`<header><div><h1>✅ 체크리스트</h1><div class="date">${now.getMonth()+1}월 ${now.getDate()}일 (${w})</div></div>
  <button class="lock" data-a="lock">${unlocked?'🔓 편집 끝내기':'🔒 부모 편집'}</button></header>
  ${gauges()}<div class="tabs"><button class="tab ${tab==='daily'?'on':''}" data-a="tab" data-v="daily">☀️ 오늘 할 일</button><button class="tab ${tab==='weekly'?'on':''}" data-a="tab" data-v="weekly">📅 이번 주</button><button class="tab ${tab==='cal'?'on':''}" data-a="tab" data-v="cal">🗓️ 달력</button></div>
  <div class="prog" hidden><b>${n} / ${its.length} 완료</b> <span class="date">(${pct}%)</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  if(its.length&&n===its.length)h+=`<div class="cheer">🎉 ${tab==='daily'?'오늘':'이번 주'} 모두 끝! 최고예요!</div>`;
  if(unlocked&&tab==='daily')h+=`<div class="edit"><b>부모 편집 모드</b> · ${tab==='daily'?'매일':'주간'} 항목은 각 카테고리에서 추가해요.
  <div class="add"><input id="nc" placeholder="새 카테고리 (예: 🧹 정리)" maxlength="20"><button data-a="addcat">추가</button></div>
  <button class="link" data-a="chpin">PIN 변경</button></div>`;
  if(tab==='daily'&&!S.cats.length)h+=`<div class="empty">${unlocked?'위에서 카테고리를 먼저 추가해 주세요.':'아직 항목이 없어요.<br>부모님이 🔒 잠금을 풀고 추가해 주세요.'}</div>`;
  h+=daySections();
  (tab==='daily'?S.cats:[]).forEach((c,i)=>{
    const ci=its.filter(x=>x.cat===c.id);
    if(!unlocked&&!ci.length)return;
    h+=`<section class="cat" style="background:var(--c${i%5})"><h2>${esc(c.name)}${unlocked?`<button class="x ${armed===c.id?'arm':''}" data-a="delcat" data-v="${c.id}">${armed===c.id?'정말 삭제?':'카테고리 삭제'}</button>`:''}</h2>`;
    ci.forEach(x=>{const d=done.includes(x.id);
      h+=`<div class="row"><button class="item ${d?'done':''}" data-a="chk" data-v="${x.id}"><span class="box">${d?'✓':''}</span><span class="t">${esc(x.text)}</span></button>${unlocked?`<button class="x" data-a="delit" data-v="${x.id}">✕</button>`:''}</div>`});
    if(unlocked)h+=`<div class="add"><input id="ni-${c.id}" placeholder="${tab==='daily'?'매일':'주간'} 항목 추가" maxlength="40"><button data-a="additem" data-v="${c.id}">추가</button></div>`;
    h+='</section>'});
  if(modal){const setup=!S.pin||modal==='chpin';
    h+=`<div class="modal"><div><b>${setup?'새 PIN 4자리 설정':'부모 PIN 입력'}</b><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err">${err}</div><button class="btn" data-a="pinok">확인</button> <button class="link" data-a="pinx">취소</button></div></div>`}
  const f=document.activeElement&&document.activeElement.id;
  app.innerHTML=tab==='cal'?h.split('<div class="prog" hidden>')[0]+calHtml():h;const p=document.getElementById('pin');if(p)p.focus();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a!=='delcat')armed=null;
  if(a==='tab')tab=v;
  else if(a==='cprev'){calM--;if(calM<0){calM=11;calY--}}
  else if(a==='cnext'){calM++;if(calM>11){calM=0;calY++}}
  else if(a==='lock'){if(tab==='cal')tab='daily';if(unlocked)unlocked=false;else{modal=S.pin?'enter':'setup';err=''}}
  else if(a==='chpin'){modal='chpin';err=''}
  else if(a==='pinx'){modal=null}
  else if(a==='pinok'){const val=document.getElementById('pin').value;
    if(!/^\d{4}$/.test(val)){err='숫자 4자리를 입력하세요';render();return}
    if(modal==='enter'){if(hash(val)===S.pin){unlocked=true;modal=null}else{err='PIN이 달라요';render();return}}
    else{S.pin=hash(val);unlocked=true;modal=null;save()}}
  else if(a==='chk'){const k=b.dataset.d?'d'+b.dataset.d:key(),l=S.checks[k]||(S.checks[k]=[]);const i=l.indexOf(v);i<0?l.push(v):l.splice(i,1);if(b.dataset.d)mark(new Date(b.dataset.d+'T00:00:00'));save()}
  else if(unlocked){
    if(a==='addcat'){const t=document.getElementById('nc').value.trim();if(t){S.cats.push({id:uid(),name:t});save()}}
    else if(a==='addwd'){const t=document.getElementById('nw-'+v).value.trim();if(t){S.items.push({id:uid(),type:'weekday',dow:+v,text:t});save()}}
    else if(a==='additem'){const t=document.getElementById('ni-'+v).value.trim();if(t){S.items.push({id:uid(),cat:v,text:t,type:tab});save()}}
    else if(a==='delit'){S.items=S.items.filter(x=>x.id!==v);save()}
    else if(a==='delcat'){if(armed===v){S.cats=S.cats.filter(c=>c.id!==v);S.items=S.items.filter(x=>x.cat!==v);armed=null;save()}else armed=v}}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const i=e.target;if(i.id==='pin')document.querySelector('[data-a=pinok]').click();else if(i.id==='nc')document.querySelector('[data-a=addcat]').click();else if(i.id&&(i.id.startsWith('ni-')||i.id.startsWith('nw-')))i.nextElementSibling.click()}});
render();
</script></body></html>
