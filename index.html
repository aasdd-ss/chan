<style>@keyframes pt{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(24px,300px);opacity:0}}.pt{animation:pt 7s linear infinite}@media (prefers-reduced-motion:reduce){.pt{animation:none;opacity:0}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){.tw{animation:none}}@keyframes sh{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}@media (prefers-reduced-motion:reduce){#shake{animation:none!important}}
:root{--bg:#EEF6EA;--card:#fff;--ink:#23301F;--sub:#5E6E58;--amber:#FFB23F;--green:#2F6B3F;--line:#D3E3CC;--bad:#C0452F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17211500;--bg:#172115;--card:#223020;--ink:#E8F2E3;--sub:#9DB096;--line:#35493269;--green:#7FCB93}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0}
.sub{color:var(--sub);font-size:.9rem;margin:0}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;border:1px solid var(--line)}
.hero{text-align:center}
.stats{display:flex;gap:8px;justify-content:center;margin:10px 0}
.stats span{background:var(--bg);border-radius:20px;padding:4px 12px;font-size:.85rem}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px}
.go{background:var(--amber);color:#3a2a00;font-weight:700;width:100%;font-size:1.05rem}
.opt{display:block;width:100%;text-align:left;font-size:1.05rem;background:var(--bg);color:var(--ink);margin:8px 0;border:2px solid transparent}
.opt.ok{border-color:var(--green);background:#d8efdc;color:#16361f}
.opt.no{border-color:var(--bad);background:#f6dcd6;color:#4a1a10}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.q{font-size:1.25rem;font-weight:700;margin:0 0 6px}
.quote{font-size:1.2rem;margin:6px 0}
.who{color:var(--sub);font-size:.9rem}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
label{display:block;margin:10px 0 2px;font-size:.9rem;color:var(--sub)}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.res{font-size:1.3rem;font-weight:700;color:var(--green);margin-top:10px}
.hide{display:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.g2 .opt{margin:0;text-align:center;min-height:76px;font-weight:700;font-size:1rem}details.sec{background:var(--bg);border-radius:12px;padding:2px 12px;margin:10px 0}details.sec>summary{font-size:1.05rem;padding:12px 0}details details{margin:6px 0 6px 6px}details details>summary{font-size:.95rem}#home{position:relative;padding-top:34px}.gbtn{position:absolute;top:10px;right:10px;background:var(--amber);color:#3a2a00;border-radius:6px;padding:6px 10px;font-size:.8rem;font-weight:700}.dkbar{background:var(--bg);border:1px dashed var(--sub);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--sub);text-align:center;margin:8px 0;touch-action:manipulation;user-select:none;cursor:pointer}.bk{font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;max-width:58%;text-align:right}.hint{font-size:.95rem;color:var(--sub);margin:2px 0 8px}.say{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-size:.85rem;border-radius:10px;margin:4px 6px 4px 0}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}.day{font-weight:700;margin:14px 0 4px}button:disabled{opacity:.55;cursor:not-allowed}.opt.ok:disabled,.opt.no:disabled{opacity:1}.note b{color:var(--green)}summary{cursor:pointer;font-weight:700;margin:8px 0}details p{margin:4px 0 10px;font-size:.95rem}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.cv{content-visibility:auto;contain-intrinsic-size:auto 260px}

 가라’ → 잘 아는 일도 다시 확인하고 해요<br><br>자세히 알아봐요: 익숙한 길도 길이 바뀌었을 수 있으니 물어보고 가라는 뜻이에요. 사기나 큰돈이 걸린 일은 '나는 잘 알아'라고 믿지 말고 어른이나 믿을 만한 곳에 한 번 더 확인해요. 확인하는 습관이 큰 실수를 막아 줘요.","x":1},{"p":"qs","q":"“잘 아는 일도 다시 확인하고 해요” — 이 뜻에 알맞은 속담이나 명언은 무엇일까요?","a":"아는 길도 물어 가라","k":"‘아는 길도 물어 가라’ → 잘 아는 일도 다시 확인하고 해요","h":"‘아는 …’로 시작하는 말을 찾아봐요.","cat":"속담·명언","gr":4,"e":"‘아는 길도 물어 가라’ → 잘 아는 일도 다시 확인하고 해요<br><br>자세히 알아봐요: 익숙한 길도 길이 바뀌었을 수 있으니 물어보고 가라는 뜻이에요. 사기나 큰돈이 걸린 일은 '나는 잘 알아'라고 믿지 말고 어른이나 믿을 만한 곳에 한 번 더 확인해요. 확인하는 습관이 큰 실수를 막아 줘요.","x":1},{"p":"qm","q":"‘하룻강아지 범 무서운 줄 모른다’는 어떤 뜻일까요?","a":"잘 모르면서 겁 없이 덤벼요","k":"‘하룻강아지 범 무서운 줄 모른다’ → 잘 모르면서 겁 없이 덤벼요","h":"‘잘 모르…’로 시작하는 말을 찾아봐요.","cat":"속담·명언","gr":5,"e":"‘하룻강아지 범 무서운 줄 모른다’ → 잘 모르면서 겁 없이 덤벼요<br><br>자세히 알아봐요: 태어난 지 하루 된 강아지는 호랑이가 얼마나 무서운지 몰라서 겁 없이 덤벼요. 잘 모르면서 용감한 척하는 것은 위험해요. 투자도 잘 모르면서 큰돈을 걸면 큰 손해를 볼 수 있어요. 먼저 배우고 작은 돈으로 시작해요.","x":1},{"p":"qs","q":"“잘 모르면서 겁 없이 덤벼요” — 이 뜻에 알맞은 속담이나 명언은 무엇일까요?","a":"하룻강아지 범 무서운 줄 모른다","k":"‘하룻강아지 범 무서운 줄 모른다’ → 잘 모르면서 겁 없이 덤벼요","h":"‘하룻강…’로 시작하는 말을 찾아봐요.","cat":"속담·명언","gr":5,"e":"‘하룻강아지 범 무서운 줄 모른다’ → 잘 모르면서 겁 없이 덤벼요<br><br>자세히 알아봐요: 태어난 지 하루 된 강아지는 호랑이가 얼마나 무서운지 몰라서 겁 없이 덤벼요. 잘 모르면서 용감한 척하는 것은 위험해요. 투자도 잘 모르면서 큰돈을 걸면 큰 손해를 볼 수 있어요. 먼저 배우고 작은 돈으로 시작해요.","x":1}],"tm":{"충동소비":"예를 들어 가게 앞에서 '와, 예쁘다!' 하고 생각 없이 바로 사 버리는 것이에요. 사고 나서 '왜 샀지?' 하고 후회하기 쉬워요. 갖고 싶을 때 하루만 기다려 보면 정말 필요한지 알 수 있어요. 헷갈리는 말: 과소비는 '너무 많이' 쓰는 것이고, 충동소비는 '생각 없이 바로' 사는 것이에요.","모방소비":"'모방'은 따라 한다는 뜻이에요. 친구들이 다 가지고 있어서 나도 똑같이 사고 싶은 마음에서 시작돼요. 나한테 정말 필요한지 먼저 물어보면 막을 수 있어요. 헷갈리는 말: 과시소비는 '자랑하려고', 모방소비는 '따라 하려고' 사는 거예요.","과시소비":"'과시'는 자랑한다는 뜻이에요. 물건이 필요해서가 아니라 남에게 보여 주고 싶어서 비싼 것을 사는 거예요. 물건은 금방 낡지만 쓴 돈은 돌아오지 않아요. 내가 쓰고 싶은 것인지 남에게 보이고 싶은 것인지 생각해 보세요.","과소비":"'과'는 지나치다는 뜻이에요. 쓸 수 있는 돈보다 많이, 또는 필요한 것보다 훨씬 많이 쓰는 거예요. 한 번에 다 쓰면 정작 꼭 필요할 때 돈이 없어요. 용돈을 주마다 나눠 두면 과소비를 막을 수 있어요.","필수소비":"'필수'는 꼭 있어야 한다는 뜻이에요. 먹을 것, 입을 것, 학교 준비물, 병원 약처럼 없으면 불편하거나 위험한 것을 사는 거예요. 이런 소비는 꼭 해야 하니까 나쁜 게 아니에요. 다만 가장 싸고 알맞은 것을 고르면 더 좋아요.","계획소비":"미리 쓸 곳과 금액을 정해 놓고 그 안에서만 쓰는 거예요. 정해 둔 돈이 있으니 갑자기 사고 싶어도 멈출 수 있어요. 계획소비를 하면 용돈이 중간에 떨어지지 않아요. 용돈 기입장과 함께 하면 더 잘돼요.","절약":"필요한 곳에는 쓰고 낭비는 줄이는 거예요. 불을 끄고, 물을 잠그고, 먹을 만큼만 담는 것이 모두 절약이에요. 무조건 안 쓰는 것이 아니라 알맞게 쓰는 것이 중요해요. 아낀 돈은 저축으로 이어져요.","예산":"쓸 돈을 미리 나누어 놓은 계획이에요. 예를 들어 한 달 용돈을 간식, 책, 저금으로 나누어 적는 거예요. 예산이 있으면 어디에 얼마를 쓸지 알 수 있어서 돈이 새지 않아요. 어른들은 가족의 예산을 세워서 살림을 해요.","수입":"일을 하거나 용돈, 세뱃돈, 선물처럼 새로 들어오는 돈이에요. 수입이 있어야 쓰고 모을 수 있어요. 헷갈리는 말: 수입은 '들어오는 돈', 지출은 '나가는 돈'이에요. 수입을 받자마자 일부를 저금하면 좋아요.","지출":"물건을 사거나 서비스를 이용하느라 밖으로 나가는 돈이에요. 간식, 버스비, 학용품 값이 모두 지출이에요. 지출을 기록해 보면 돈이 어디로 가는지 보여요. 지출이 수입보다 많으면 돈이 모자라게 돼요.","저축":"쓰지 않고 모아 두는 돈이에요. 저금통이나 통장에 넣어 두면 나중에 갖고 싶은 것이나 급한 일에 쓸 수 있어요. 작은 돈도 꾸준히 모이면 큰 돈이 돼요. 저축은 '미래의 나에게 주는 선물'이에요.","선저축":"'선'은 먼저라는 뜻이에요. 용돈을 받으면 먼저 저금하고, 남은 돈으로 쓰는 방법이에요. 쓰고 남은 돈을 모으려고 하면 남는 돈이 거의 없어요. 순서만 바꿔도 저축이 훨씬 쉬워져요.","단기 계획":"짧은 기간 안에 이루려는 목표예요. 이번 주나 이번 달 안에 할 수 있는 것이에요. 예: 이번 주에 공책 사기. 작은 목표를 이루면 자신감이 생겨서 더 큰 목표에 도전할 수 있어요.","중기 계획":"몇 달에서 한두 해 정도 걸리는 목표예요. 단기보다 길고 장기보다 짧아요. 예: 몇 달 모아서 자전거 사기. 중간에 힘들어도 조금씩 모으면 이룰 수 있어요.","장기 계획":"아주 긴 시간이 걸리는 큰 목표예요. 어른이 되었을 때를 생각하는 목표가 많아요. 예: 대학 학비 모으기, 내 집 마련하기. 오래 걸리기 때문에 일찍 시작할수록 유리해요.","비상금":"'비상'은 갑작스러운 일이라는 뜻이에요. 아플 때나 물건이 고장 났을 때처럼 급할 때를 위해 따로 모아 둔 돈이에요. 평소에는 쓰지 않아야 진짜 비상금이에요. 비상금이 있으면 갑자기 돈이 필요해도 당황하지 않아요.","용돈 기입장":"받은 돈과 쓴 돈을 날짜별로 적는 공책이에요. 적어 보면 돈이 어디로 새는지 한눈에 보여요. 매일 조금씩 적는 습관이 중요해요. 며칠 빼먹어도 괜찮아요. 기억나는 대로 적고 다시 이어서 쓰면 돼요.","이자":"은행에 돈을 맡기면 은행이 그 돈을 쓰는 대가로 조금 더 얹어 주는 돈이에요. 돈이 일해서 번 돈이라고 생각하면 쉬워요. 맡긴 돈이 클수록, 맡긴 기간이 길수록 이자도 많아져요. 헷갈리는 말: 원금은 처음 맡긴 돈이고, 이자는 그 위에 더 붙는 돈이에요.","복리":"이자에도 다시 이자가 붙어서 눈덩이처럼 커지는 방식이에요. 처음에는 조금씩 늘지만 오래 두면 늘어나는 속도가 점점 빨라져요. 그래서 일찍 시작해서 오래 기다리는 것이 중요해요. 헷갈리는 말: 단리는 처음 돈에만 이자가 붙어요.","단리":"처음 맡긴 돈(원금)에만 이자가 붙는 방식이에요. 해마다 이자가 같은 금액이에요. 복리보다 천천히 늘어나요. 복리와 비교해서 기억하면 좋아요. 복리는 이자에도 이자가 붙고, 단리는 원금에만 붙어요.","원금":"처음 은행에 맡긴 내 돈이에요. 이자는 이 원금을 기준으로 계산돼요. 이자를 빼고 처음 맡긴 돈만 말할 때 원금이라고 해요. 빌릴 때도 마찬가지로 처음 빌린 돈을 원금이라고 해요.","적립식 저축":"한꺼번에 많이 넣는 것이 아니라 매달, 매주 일정한 금액을 꾸준히 넣는 방법이에요. 부담이 적어서 오래 할 수 있어요. 용돈에서 조금씩 넣어도 시간이 지나면 큰돈이 돼요. 중요한 것은 빠뜨리지 않고 꾸준히 하는 거예요.","예금":"은행에 돈을 맡겨 두는 거예요. 집에 두면 잃어버리거나 쓰기 쉬운데 은행에 두면 안전하고 이자도 받을 수 있어요. 필요할 때 다시 찾을 수 있어요. 어린이는 부모님과 함께 통장을 만들어요.","은행":"사람들의 돈을 안전하게 맡아 주고, 돈이 필요한 사람에게 빌려주기도 하는 곳이에요. 통장을 만들 수 있고 이자도 받을 수 있어요. 은행은 맡긴 돈을 다른 사람에게 빌려주면서 그 이자로 운영돼요.","대출":"은행에서 돈을 빌리는 거예요. 집을 사거나 가게를 열 때처럼 큰돈이 필요할 때 이용해요. 빌린 돈은 약속한 날까지 이자와 함께 갚아야 해요. 갚을 수 있는지 잘 생각하고 빌려야 해요.","보험":"아프거나 다치거나 사고가 날 때를 대비해서 미리 조금씩 돈을 내 두는 거예요. 큰일이 생기면 그 돈으로 도움을 받을 수 있어요. 평소에는 돈이 나가는 것 같지만 큰 어려움을 막아 줘요.","세금":"나라가 학교, 도로, 공원, 소방서를 만들고 운영하려고 국민이 내는 돈이에요. 물건 값에도 세금이 포함되어 있어요. 우리가 낸 세금은 모두가 함께 쓰는 것을 만드는 데 쓰여요.","연금":"일을 쉬는 나이가 되었을 때 매달 받는 돈이에요. 젊을 때 미리 꾸준히 내 두었기 때문에 받을 수 있어요. 연금이 있으면 나이 들어서도 생활할 수 있어요.","수수료":"돈을 보내 주거나 택배를 보내 주는 것처럼 서비스를 이용하고 내는 값이에요. 물건 값과는 별도로 내요. 은행에서 다른 곳으로 돈을 보낼 때도 수수료를 내는 경우가 있어요.","노후 준비":"'노후'는 나이 들어 일을 쉬는 때를 말해요. 젊을 때부터 조금씩 돈을 모아 두는 거예요. 일찍 시작할수록 부담이 적고 이자나 투자 효과도 커져요. 연금과 저축, 건강 관리가 모두 노후 준비예요.","분산투자":"돈을 한 곳에 몰지 않고 여러 곳에 나누어 넣는 방법이에요. '달걀을 한 바구니에 담지 마라'는 말과 같아요. 한 곳이 잘못돼도 다른 곳이 버텨 줘서 한 번에 크게 잃지 않아요.","장기투자":"오랜 시간을 기다리며 키워 가는 투자예요. 값이 잠깐 내려가도 팔지 않고 기다려요. 씨앗을 심고 나무가 자라길 기다리는 것과 같아요. 시간이 지날수록 복리 효과도 커져요.","투자 위험":"투자한 돈이 줄어들 수도 있는 가능성이에요. 투자는 늘어날 수도 있지만 줄어들 수도 있어요. 그래서 잃어도 괜찮은 돈으로, 잘 알아보고 해야 해요. 높은 수익을 약속하는 말은 특히 조심해요.","사기":"거짓말로 남의 돈을 가로채는 나쁜 범죄예요. '쉽게 부자 된다', '지금 안 하면 손해'라는 말로 마음을 급하게 만들어요. 이런 말을 들으면 돈을 보내지 말고 꼭 어른과 상의해요.","물가 상승":"'물가'는 물건 값을 말해요. 시간이 지나면서 물건 값이 전체적으로 오르는 거예요. 같은 돈으로 살 수 있는 물건이 줄어들어서 돈의 힘이 약해져요. 그래서 돈은 그냥 두는 것보다 불리는 것이 중요해요.","수익":"투자나 장사로 번 이익이에요. 들인 돈보다 더 많이 돌려받았을 때 그 차이가 수익이에요. 헷갈리는 말: 이자는 은행에 맡겨서 받는 돈이고, 수익은 장사나 투자로 얻는 이익이에요.","신용":"약속을 잘 지켜서 사람들에게 얻는 믿음이에요. 빌린 것을 약속한 날 돌려주면 신용이 쌓여요. 신용은 한 번 잃으면 다시 쌓기 어려워요. 어른이 되면 신용이 좋아야 은행에서 돈도 빌릴 수 있어요.","기회비용":"하나를 고르면 다른 하나는 포기해야 해요. 그때 포기한 것 중 가장 좋은 것이 기회비용이에요. 예: 피자 대신 치킨을 골랐다면 포기한 피자가 기회비용이에요. 헷갈리는 말: 선택의 대가는 내가 직접 내는 것이고, 기회비용은 못 하게 된 것이에요.","선택의 대가":"무언가를 얻으려고 직접 내야 하는 돈, 시간, 노력이에요. 시험을 잘 보려면 놀 시간을 내야 해요. 세상에 공짜는 없어요. 고르기 전에 무엇을 내야 하는지 먼저 생각해 보세요.","나눔":"내가 가진 것을 어려운 사람과 함께 쓰는 거예요. 용돈 일부를 기부하거나 안 쓰는 물건을 필요한 사람에게 주는 것도 나눔이에요. 나누면 받는 사람도 기쁘고 나도 마음이 따뜻해져요.","습관":"매일 반복해서 몸에 밴 행동이에요. 좋은 습관을 만들면 애쓰지 않아도 저절로 하게 돼요. 매일 저금통에 동전 넣기, 용돈 기입장 쓰기가 돈 습관이에요. '세 살 버릇 여든까지 간다'는 말처럼 일찍 만들수록 좋아요.","가격 비교":"같은 물건을 파는 여러 곳의 값을 알아보는 거예요. 같은 물건인데도 가게마다 값이 달라서 비교하면 돈을 아낄 수 있어요. 값만 보지 말고 품질도 같이 확인해요.","자산":"가지고 있으면 돈이 계속 들어오게 해 주는 것이에요. 예: 이자가 나오는 예금, 월세가 나오는 집. 헷갈리는 말: 자산은 내 주머니로 돈을 들어오게 하고, 부채는 내 주머니에서 돈이 나가게 해요.","부채":"갚아야 해서 돈이 나가게 만드는 빚이에요. 빌린 돈은 이자까지 갚아야 해요. 부채가 너무 많으면 돈이 있어도 갚느라 쓸 수 없어요. 꼭 필요한 만큼만, 갚을 수 있을 때만 빌려요.","일하는 돈":"내가 일하지 않아도 스스로 불어나서 나를 위해 일해 주는 돈이에요. 이자가 붙는 저금이나 투자한 돈이 예가 돼요. 돈을 일찍 모아서 일하게 하면 나중에 큰 도움이 돼요.","안전마진":"예상이 틀려도 괜찮도록 미리 남겨 두는 넉넉함이에요. 계획보다 돈이 더 들 수 있으니 조금 더 남겨 두는 거예요. 다리를 건널 때 튼튼한 다리를 고르는 것처럼 여유를 두면 안전해요.","만족 지연":"지금 당장 갖고 싶은 마음을 참고 더 큰 보상을 기다리는 거예요. 마시멜로를 참으면 두 개를 받는 실험이 유명해요. 참을성이 있으면 저축과 목표 달성이 쉬워져요.","작은 습관":"아주 작아서 매일 쉽게 할 수 있는 행동이에요. 예: 하루에 동전 하나 저금하기. 작아서 부담이 없으니 오래 이어 가기 쉽고, 쌓이면 큰 변화를 만들어요.","검소":"꼭 필요한 곳에만 쓰고 겉모습에는 돈을 아끼는 생활이에요. 부자라도 검소하게 사는 사람이 많아요. 무조건 안 쓰는 것이 아니라 소중한 곳에 쓰기 위해 겉치레를 줄이는 거예요.","시장의 기분":"주식 값이 사람들의 기분에 따라 오르락내리락하는 것이에요. 사람들이 기분 좋으면 사려는 사람이 많아 오르고, 불안하면 팔려는 사람이 많아 내려요. 기분에 휩쓸리지 말고 내 계획을 지키는 것이 중요해요.","손실 회피":"얻는 기쁨보다 잃는 아픔을 더 크게 느끼는 마음이에요. 천 원을 줍는 기쁨보다 잃어버리는 속상함이 더 크죠. 이 마음 때문에 손해가 무서워서 잘못된 선택을 할 수 있어요.","닻 내리기":"배가 닻을 내리면 움직이지 못하듯, 처음 본 숫자에 생각이 묶이는 마음이에요. 처음에 큰 가격표를 보면 다음 가격이 싸게 느껴져요. 처음 본 숫자와 관계없이 내게 정말 알맞은 값인지 따져 봐요.","군중 심리":"'군중'은 많은 사람들이에요. 남들이 다 하니까 나도 따라 하고 싶은 마음이에요. 모두가 줄을 서 있으면 이유도 모르고 서게 돼요. 따라 하기 전에 내가 이해했는지 확인해요.","현재 편향":"먼 미래의 큰 것보다 지금의 작은 것을 더 좋아하는 마음이에요. 내일 받을 큰 과자보다 지금 먹는 작은 과자가 더 좋아 보여요. 이 마음 때문에 저축이 어려워요. 저금을 먼저 하는 방법이 도움이 돼요.","매몰비용":"이미 써 버려서 되찾을 수 없는 돈이나 시간이에요. 아까워서 재미없는 영화를 끝까지 보기도 해요. 이미 쓴 돈은 돌아오지 않으니 앞으로 어떤 선택이 좋은지만 생각해요.","과신":"내가 잘 안다고 너무 믿는 마음이에요. 한두 번 맞혔다고 다음에도 맞힐 거라고 믿으면 위험해요. 잘 안다고 느낄수록 한 번 더 확인하고, 큰돈을 걸지 않아요.","소유 효과":"내 것이 되면 더 값져 보이는 마음이에요. 가게에서는 비싸 보였던 물건도 내 것이 되면 팔기 싫어요. 내 물건이라서 높게 평가하는 건 아닌지 생각해 봐요.","희소성":"귀하고 적어서 더 갖고 싶어지는 것이에요. '딱 한 개 남았어요'라는 말에 더 사고 싶어져요. 적다고 해서 꼭 좋은 건 아니에요. 정말 필요한지 먼저 생각해요.","공짜 효과":"'공짜'라는 말에 눈이 가려서 필요 없는 것도 갖고 싶어지는 마음이에요. 공짜여도 필요 없으면 쓸데없는 물건이에요. 공짜 뒤에는 다른 것을 사게 하려는 마음이 있을 때가 많아요.","확증 편향":"내가 믿는 것만 찾아서 믿으려는 마음이에요. 내 생각과 같은 이야기만 읽고 다른 이야기는 무시해요. 다른 생각도 일부러 찾아보면 더 정확하게 알 수 있어요.","틀짜기":"같은 일도 말하는 방식에 따라 다르게 느끼는 것이에요. '열 명 중 아홉이 성공'은 좋게, '열 명 중 한 명은 실패'는 나쁘게 들리지만 같은 이야기예요. 말에 흔들리지 말고 숫자를 직접 확인해요.","선택 과부하":"고를 것이 너무 많아서 오히려 고르기 힘든 거예요. 아이스크림 맛이 너무 많으면 한참 서 있게 돼요. 기준을 두세 가지 정해서 후보를 줄이면 쉬워요.","후회 회피":"나중에 후회할까 봐 결정을 피하는 마음이에요. 하지만 아무것도 안 하면 기회를 놓쳐요. 완벽한 선택은 없으니 정한 기준대로 고르고 배우면 돼요.","평균으로 돌아가기":"아주 좋거나 나빴던 결과 뒤에는 보통으로 돌아오기 쉬운 것이에요. 시험을 아주 잘 본 다음에는 보통 점수가 나오는 일이 많아요. 운이 섞여 있기 때문이에요. 한 번의 결과에 너무 기뻐하거나 실망하지 않아요.","비교 심리":"남이 가진 것과 견주어서 부럽거나 속상해지는 마음이에요. 비교는 끝이 없어서 늘 부족하게 느껴져요. 어제의 나와 비교하면 마음이 편해요.","욕심":"이미 가진 것이 많아도 더 많이 갖고 싶은 마음이에요. 욕심이 지나치면 만족하지 못하고 낭비하기 쉬워요. 가진 것에 고마워하면 욕심이 줄어요.","부러움":"남이 가진 것을 나도 갖고 싶은 마음이에요. 누구나 느낄 수 있어요. 부러운 마음이 들면 '내게 정말 필요한가?' 물어보고 내가 가진 것도 떠올려 봐요.","참을성":"하고 싶은 것을 참고 기다리는 힘이에요. 간식을 저녁까지 참거나 갖고 싶은 것을 모아서 사는 것이 참을성이에요. 참을성이 있으면 저축도 쉬워져요."},"pm":{"티끌 모아 태산":"티끌은 아주 작은 먼지이고 태산은 아주 큰 산이에요. 작은 먼지도 계속 모이면 큰 산이 된다는 뜻이에요. 하루 100원씩 모으면 한 달에 3,000원, 1년이면 3만 6천 원이 돼요. 작은 저축을 얕보지 말고 꾸준히 해요.","천 리 길도 한 걸음부터":"천 리는 아주 먼 거리예요. 아무리 먼 길도 첫걸음부터 시작한다는 뜻이에요. 큰 목표도 한 번에 이룰 수 없고 오늘 할 작은 일부터 해야 해요. 큰 저금 목표도 오늘 동전 하나 넣기부터 시작해요.","한 푼을 아끼는 것은 한 푼을 버는 것이다":"미국의 벤저민 프랭클린이 한 말로 알려져 있어요. 쓰지 않고 아낀 돈은 내 주머니에 그대로 남으니 번 것과 같다는 뜻이에요. 돈을 버는 것은 어렵지만 아끼는 것은 지금 당장 할 수 있어요.","작은 구멍 하나가 큰 배를 가라앉힌다":"벤저민 프랭클린이 한 말로 알려져 있어요. 작은 구멍을 그냥 두면 물이 계속 들어와서 큰 배도 가라앉아요. 작은 낭비도 계속되면 큰 손해가 돼요. 작은 지출이라고 무시하지 말고 살펴봐요.","쓰고 남은 돈을 저금하지 말고 저금하고 남은 돈을 써라":"세계적인 투자자 워런 버핏이 한 말로 알려져 있어요. 쓰고 남은 돈을 저금하려고 하면 남는 돈이 거의 없어요. 먼저 저금하고 남은 돈으로 쓰는 '선저축'이 훨씬 확실해요.","오래전 누군가 나무를 심어서 지금 그늘이 생겼다":"워런 버핏의 말로 알려져 있어요. 지금 그늘에서 쉴 수 있는 것은 오래전에 누군가 나무를 심었기 때문이에요. 오늘 준비하는 저축과 공부가 먼 훗날의 나에게 그늘이 돼요.","달걀을 한 바구니에 담지 마라":"달걀을 한 바구니에 다 담으면 바구니를 떨어뜨릴 때 전부 깨져요. 여러 바구니에 나누어 담으면 일부만 깨져요. 돈도 한 곳에 몰지 않고 나누어 넣으면 한 곳이 잘못돼도 크게 잃지 않아요. 이것이 분산투자예요.","아끼는 것이 버는 것이다":"1,000원을 아끼면 1,000원을 번 것과 같아요. 쓰지 않으면 내 돈이 그대로 있으니까요. 하지만 번 돈은 세금을 내거나 시간이 드는데, 아낀 돈은 바로 내 것이에요. 다만 꼭 필요한 곳에는 써야 해요.","선택에는 반드시 대가가 따른다":"무언가를 고르면 그것을 얻으려고 돈, 시간, 노력을 내야 하고 다른 것은 포기해야 해요. 공짜로 얻을 수 있는 선택은 없어요. 고르기 전에 무엇을 내야 하는지 생각해 보세요. 이것이 '선택의 대가'와 '기회비용'이에요.","진인사대천명":"한자로 '사람의 일을 다하고 하늘의 뜻을 기다린다'는 뜻이에요. 내가 할 수 있는 노력은 최선을 다하고, 결과는 편한 마음으로 기다리라는 말이에요. 노력은 내가 정하지만 결과에는 운도 있기 때문에 마음을 편하게 가질 수 있어요.","시작이 반이다":"무슨 일이든 시작하기가 가장 어려워요. 시작만 하면 절반은 한 것과 같다는 뜻이에요. 저금도 처음 한 번이 어려워요. 오늘 동전 하나를 넣는 것이 시작이에요.","급할수록 돌아가라":"급하다고 지름길로 서두르면 실수하기 쉬워요. 차분하게 순서대로 하는 것이 오히려 빨라요. 급한 마음에 물건을 사거나 돈을 보내면 후회하기 쉬워요. 급할수록 한 번 더 확인해요.","돌다리도 두들겨 보고 건너라":"튼튼해 보이는 돌다리도 두들겨 보고 건너야 안전해요. 잘 아는 일도 조심해서 확인하라는 뜻이에요. 큰돈이 오가는 일은 특히 한 번 더 확인해야 사기나 실수를 막을 수 있어요.","소 잃고 외양간 고친다":"소를 잃어버린 뒤에 외양간을 고쳐도 소는 돌아오지 않아요. 일이 터진 뒤에 고치면 늦으니 미리 대비하라는 뜻이에요. 돈을 잃어버린 뒤에 후회하기 전에 미리 계획하고 조심해요.","호미로 막을 것을 가래로 막는다":"작은 호미로 막을 수 있던 일을 방치해서 큰 가래로 막아야 한다는 뜻이에요. 작은 문제는 작을 때 해결해요. 작은 빚이나 작은 낭비도 바로 바로잡으면 쉬워요.","세 살 버릇 여든까지 간다":"어릴 때 든 버릇은 나이가 들어도 잘 바뀌지 않는다는 뜻이에요. 저금하는 습관, 기록하는 습관 같은 좋은 돈 습관도 어릴 때 들이면 평생 도움이 돼요. 반대로 낭비하는 습관도 오래가요.","공든 탑이 무너지랴":"정성을 들여 쌓은 탑은 무너지지 않는다는 뜻이에요. 열심히 노력한 일은 헛되지 않아요. 꾸준히 쌓은 저축도 정성껏 모으면 든든한 힘이 돼요.","우물 안 개구리":"우물 안에 사는 개구리는 하늘이 우물 입구만큼만 보인다고 생각해요. 넓은 세상을 모르고 내 생각이 전부라고 믿는 거예요. 돈 공부도 책과 어른에게 배우면서 넓게 알아야 해요.","구슬이 서 말이라도 꿰어야 보배":"구슬이 많아도 실에 꿰어 목걸이로 만들어야 쓸모 있어요. 돈도 모으기만 하지 말고 목표에 맞게 쓸모 있게 써야 가치가 있어요.","밑 빠진 독에 물 붓기":"밑이 빠진 독에는 물을 아무리 부어도 새어 나가서 채워지지 않아요. 아무리 벌어도 낭비하면 돈이 모이지 않아요. 먼저 새는 곳(낭비)을 막는 것이 중요해요.","곳간에서 인심 난다":"곳간은 곡식을 쌓아 두는 창고예요. 창고가 넉넉해야 남에게 나눠 줄 수 있다는 뜻이에요. 내가 먼저 안정적으로 모아 두면 나눔도 할 수 있어요.","쇠뿔도 단김에 빼라":"쇠뿔을 뺄 때는 뜨거울 때 단번에 빼야 쉬워요. 하려는 일은 마음먹었을 때 바로 해야 한다는 뜻이에요. 저금 결심도 미루면 잊어버리니 오늘 바로 시작해요. 다만 물건을 살 때는 서두르지 말고 하루 기다려요.","말 한마디에 천 냥 빚도 갚는다":"천 냥은 아주 큰돈이에요. 말을 잘하면 큰 어려움도 풀 수 있다는 뜻이에요. 약속을 지키고 정직하게 말하면 사람들의 믿음, 즉 신용이 쌓여요.","백지장도 맞들면 낫다":"얇은 종이 한 장도 둘이 들면 더 가벼워요. 쉬운 일도 함께하면 더 쉬워져요. 가족과 함께 돈 계획을 세우면 더 잘할 수 있어요.","되로 주고 말로 받는다":"되와 말은 곡식의 양을 재는 단위인데 말이 되보다 훨씬 커요. 조금 주고 많이 돌려받는다는 뜻이에요. 작은 친절이나 나눔이 나중에 더 큰 기쁨으로 돌아오기도 해요.","오르지 못할 나무는 쳐다보지도 마라":"올라가지 못할 높은 나무는 쳐다보지도 말라는 뜻이에요. 내 힘에 맞지 않는 지나친 욕심은 내지 말라는 말이에요. 용돈으로 살 수 없는 물건은 목표를 정해 모으거나 포기하는 것이 좋아요.","꿩 먹고 알 먹기":"꿩도 잡고 꿩의 알까지 얻는다는 뜻이에요. 한 번에 두 가지 이득을 얻는 것을 말해요. 예를 들어 물건을 오래 쓰면 돈도 아끼고 환경도 지킬 수 있어요.","열 번 찍어 안 넘어가는 나무 없다":"단단한 나무도 열 번 찍으면 넘어간다는 뜻이에요. 끈기 있게 계속하면 결국 이룰 수 있어요. 저금도 포기하지 않고 계속하면 목표를 이룰 수 있어요.","참을 인 자 셋이면 살인도 피한다":"'참을 인(忍)' 글자를 세 번 쓰면서 참으면 큰 잘못도 피할 수 있다는 뜻이에요. 사고 싶은 마음이 들 때도 세 번 참으면 충동소비를 막을 수 있어요. 참을성은 돈 공부에 가장 중요한 힘이에요.","비 온 뒤에 땅이 굳는다":"비가 와서 질척하던 땅이 마르면 더 단단해져요. 어려움을 겪고 나면 더 강해진다는 뜻이에요. 돈 때문에 실수했어도 배우고 고치면 더 현명해져요.","같은 값이면 다홍치마":"값이 같다면 더 예쁜 다홍색 치마를 고르라는 뜻이에요. 같은 값이면 더 좋은 것을 고르라는 말이에요. 가격 비교를 해서 같은 돈으로 더 좋은 것을 사면 돼요.","개구리 올챙이 적 생각 못 한다":"개구리가 되고 나면 올챙이 시절을 잊는다는 뜻이에요. 형편이 좋아지면 어렵던 때를 잊기 쉬워요. 돈이 생겨도 어려웠던 때와 고마운 사람을 기억하고 겸손해야 해요.","하늘이 무너져도 솟아날 구멍이 있다":"아무리 어려운 일이 생겨도 해결할 방법은 있다는 뜻이에요. 돈이 모자라 힘들어도 포기하지 말고 어른과 의논하면 길을 찾을 수 있어요. 비상금을 모아 두면 더 든든해요.","친구 따라 강남 간다":"강남은 옛날에 아주 먼 곳이었어요. 가고 싶지 않아도 친구가 가니까 따라간다는 뜻이에요. 친구가 사니까 나도 사는 '모방소비'와 같아요. 따라 하기 전에 나에게 정말 필요한지 물어봐요."},"qm":{"용돈을 받으면 가장 먼저 할 일은?":"용돈이 들어오자마자 일부를 떼어 두면 쓰고 싶은 마음이 생기기 전에 돈이 안전해져요. 쓰고 남은 돈을 모으려면 남는 돈이 거의 없어요. 이것을 '선저축'이라고 해요.","사고 싶은 물건이 생겼을 때 좋은 행동은?":"사고 싶은 마음은 시간이 지나면 약해질 때가 많아요. 하루를 기다리면 정말 필요한지, 다른 방법은 없는지 차분히 생각할 수 있어요. 이것이 충동소비를 막는 가장 쉬운 방법이에요.","큰돈을 벌게 해 준다며 돈을 달라는 사람을 만나면?":"쉽게 큰돈을 벌게 해 준다는 말은 사기일 때가 많아요. 혼자 판단하지 말고 어른과 먼저 이야기하면 속지 않을 수 있어요.","빌린 물건이나 돈은 언제 돌려줄까요?":"약속한 날 돌려주면 상대가 나를 믿어요. 이렇게 믿음이 쌓이면 신용이 되고, 다음에도 기꺼이 빌려줘요. 약속을 어기면 믿음을 잃기 쉬워요.","용돈을 한 달 동안 잘 쓰려면?":"예산을 세우면 쓸 돈이 정해져 있어서 중간에 모자라지 않아요. 기록하면 어디에 얼마를 썼는지 알 수 있어서 다음 달에 더 잘 쓸 수 있어요.","물건을 사기 전에 해 볼 일은?":"같은 물건도 가게마다 값이 달라요. 사기 전에 여러 곳의 값을 비교하면 같은 돈으로 더 좋은 것을 사거나 돈을 아낄 수 있어요.","쓰지 않는 물이나 불은 어떻게 할까요?":"쓰지 않는 불과 물은 그냥 흘러가는 돈이에요. 바로 끄고 잠그면 전기와 물을 아끼고 환경도 지켜요. 작은 습관이 모여서 큰 절약이 돼요.","친구들이 다 산다고 할 때는?":"친구들이 다 산다고 해서 나에게도 필요한 것은 아니에요. 먼저 '나에게 정말 필요한가?' 물어보면 모방소비를 막을 수 있어요.","투자를 처음 배울 때는?":"투자는 돈이 줄어들 수도 있어요. 어른과 함께, 잃어도 괜찮은 작은 돈으로 연습하면서 배우면 큰 실수를 막을 수 있어요.","큰 목표를 이루려면?":"큰 목표는 한 번에 이루기 어려워서 포기하기 쉬워요. 작은 목표를 하나씩 이루면 자신감이 생기고 큰 목표에 가까워져요.","갑자기 쓸 돈이 필요할 때를 대비하려면?":"갑자기 병원에 가거나 물건이 고장 나는 일은 언제든 생길 수 있어요. 비상금이 있으면 당황하지 않고 해결할 수 있어요.","용돈이 남았을 때 좋은 방법은?":"쓰고 남은 돈은 쓰기 쉬워서 금방 사라져요. 저축하거나 나눔에 쓰면 내 미래도 돕고 다른 사람도 도울 수 있어요.","가게에서 예쁜 물건을 봤어요. 지갑을 열기 전에 할 일은?":"예쁜 물건을 보면 마음이 앞서요. 먼저 내가 가진 돈과 정말 필요한지 확인하면 충동소비를 막을 수 있어요.","받은 용돈을 한 달 동안 오래 쓰려면?":"한 달 용돈을 한꺼번에 쓰면 금방 떨어져요. 주마다 쓸 몫을 나누면 한 달 내내 쓸 수 있고, 계획대로 쓰는 연습도 돼요.","갖고 싶은 것이 너무 비쌀 때 좋은 방법은?":"너무 비싼 물건은 한 번에 살 수 없어요. 목표를 정하고 조금씩 모으면 결국 살 수 있어요. 기다리는 동안 정말 필요한지도 생각하게 돼요.","쓴 돈을 기록하면 좋은 점은?":"기록하면 보이지 않던 지출이 눈에 보여요. 간식이나 작은 물건에 자꾸 새는 돈을 찾으면 다음에 줄일 수 있어요.","'세일'이라는 말이 붙은 물건을 만났을 때 먼저 할 일은?":"'세일'은 사게 만드는 말이에요. 싸더라도 필요 없는 물건이면 돈을 쓰는 거예요. 필요한 물건인지 먼저 생각해야 진짜 절약이에요.","친구에게 돈을 빌려주기 전에 해 볼 일은?":"친구와 돈을 빌리고 빌려주는 일은 갚는 날을 잊어서 사이가 나빠지기 쉬워요. 어른과 상의하고 갚을 날을 정확히 정하면 서로 마음이 편해요.","저금통이 가득 찼을 때 가장 좋은 방법은?":"저금통이 가득 차면 은행에 넣는 것이 안전해요. 집에 두면 잃어버리거나 쓰기 쉽고, 은행에서는 이자도 받을 수 있어요.","내가 가진 돈을 자랑하고 싶을 때는?":"돈을 자랑하면 과시소비로 이어지고 나쁜 사람에게 표적이 될 수도 있어요. 필요한 곳에 조용히 쓰는 것이 안전하고 현명해요.","생일에 받은 용돈은 어떻게 쓰면 좋을까요?":"모두 쓰면 나중에 후회할 수 있고 모두 저금하면 즐거움이 없어요. 일부는 저금하고 일부는 계획해서 쓰면 균형이 맞아요.","쓰던 물건이 조금 낡아서 새로 사고 싶을 때는?":"낡았다고 바로 새로 사면 돈이 많이 들어요. 고쳐 쓸 수 있는지 먼저 생각하면 돈도 아끼고 물건도 오래 쓸 수 있어요.","친구가 같이 간식을 사 먹자는데 용돈이 부족해요. 어떻게 할까요?":"용돈이 부족한데 억지로 쓰면 계획이 무너져요. 솔직하게 말하는 것은 부끄러운 일이 아니에요. 진짜 친구는 이해해 줘요.","새 학기 준비물을 사러 가기 전에 가장 먼저 할 일은?":"준비물 목록을 먼저 보면 필요한 것만 사서 돈과 시간을 아낄 수 있어요. 목록 없이 가면 필요 없는 것까지 사기 쉬워요.","가격표를 보니 갖고 싶은 장난감이 용돈보다 비싸요. 다음으로 할 일은?":"가격과 내 용돈을 비교해서 몇 주를 모아야 하는지 계산하면 목표가 구체적이 돼요. 계산해 보면 포기할지 모을지도 정할 수 있어요.","친구가 생일 선물로 아주 비싼 걸 사 달라고 해요. 어떻게 할까요?":"친구에게 마음을 전하는 것이 중요하지 값이 중요한 게 아니에요. 형편에 맞는 선물을 고르면 부담도 없고 마음도 전해져요.","동생이 내 저금통 돈을 쓰고 싶다고 해요. 어떻게 할까요?":"이유를 들어 보면 동생이 정말 필요한 일인지 알 수 있어요. 어른과 의논하면 서로 기분 상하지 않게 정할 수 있어요.","용돈을 잃어버렸어요. 알맞은 행동은?":"당황하면 더 못 찾아요. 있었던 곳을 차분히 찾아보고 다음에는 잃어버리지 않게 챙기는 방법(지갑이나 주머니 정하기)을 정해요.","게임 광고가 아이템을 사라고 계속 떠요. 어떻게 할까요?":"광고는 사게 만들려고 만든 거예요. 게임 아이템은 현실의 돈이 드는 것이라 어른과 상의해야 해요. 사기 전에 한 번 멈추는 것이 중요해요.","가게에서 거스름돈을 더 받은 걸 알았어요. 어떻게 할까요?":"더 받은 돈은 내 돈이 아니에요. 바로 돌려주면 정직한 사람으로 믿음(신용)이 쌓여요.","친구가 빌려 간 돈을 돌려주지 않아요. 어떻게 할까요?":"화를 내면 사이가 나빠져요. 정중하게 다시 말하고 어른과 의논하면 사이도 지키고 돈도 돌려받을 수 있어요.","갖고 싶은 운동화가 용돈으로는 부족해요. 알맞은 방법은?":"목표 금액과 모을 기간을 정하면 매주 얼마씩 모을지 알 수 있어요. 목표가 있으면 포기하지 않고 계속할 수 있어요.","방학 용돈을 한꺼번에 받았어요. 오래 쓰려면?":"한꺼번에 받은 용돈은 한 주씩 봉투에 나누어 담아 두면 한 번에 다 쓰는 것을 막아 줘요. 눈에 보이게 나누는 것이 효과적이에요.","문구점에서 쿠폰을 받았어요. 알맞은 사용법은?":"쿠폰이 있다고 필요 없는 물건을 사면 오히려 돈을 쓰는 거예요. 꼭 살 물건이 있을 때만 쓰면 진짜 이득이에요.","가족 외식에서 비싼 메뉴가 많아요. 어떻게 고를까요?":"가족의 형편을 생각하는 것은 가족을 배려하는 마음이에요. 알맞은 가격의 메뉴를 고르면 모두가 편하게 먹을 수 있어요.","친구들이 모두 같은 가방을 사자고 해요. 어떻게 할까요?":"친구들이 다 산다고 나도 사야 하는 건 아니에요. 필요하지 않다고 말하는 용기가 모방소비를 막아요.","저금통 돈이 생각보다 많이 모였어요. 어떻게 쓸까요?":"모은 돈을 다 쓰면 다시 처음부터 시작해야 해요. 일부는 통장에 안전하게 두고 일부는 목표에 쓰면 균형이 잡혀요.","생일에 선물 대신 돈을 받았어요. 먼저 할 일은?":"감사 인사는 상대의 마음에 대한 예의예요. 쓸 곳을 목록으로 적으면 충동적으로 쓰는 것을 막을 수 있어요.","놀이공원 기념품 가게에 예쁜 게 너무 많아요. 어떻게 할까요?":"예쁜 것이 많으면 다 사고 싶어져요. 미리 금액을 정해 가면 그 안에서만 쓸 수 있어요. 계획소비의 좋은 예예요.","용돈 기입장을 며칠 빼먹었어요. 알맞은 행동은?":"며칠 빼먹었다고 포기하면 습관이 끊겨요. 기억나는 대로 적고 다시 이어 쓰면 습관이 유지돼요. 완벽보다 꾸준함이 중요해요.","같은 물건이 가게마다 값이 달라요. 어떻게 살까요?":"값이 싼 곳만 고르면 품질이 나쁠 수 있어요. 값과 품질을 함께 보고 알맞은 곳을 고르면 가장 이득이에요.","친구가 내 간식을 계속 얻어먹어요. 어떻게 말할까요?":"계속 얻어먹으면 내가 손해를 보고 사이도 불편해져요. 기분 나쁘지 않게 각자 몫은 각자 사자고 말하면 서로 편해요.","선생님이 모금 활동을 한다고 하셨어요. 어떻게 참여할까요?":"모금은 어려운 이웃을 돕는 일이에요. 억지로 많이 낼 필요 없이 내 형편에 맞게 마음을 전하면 충분해요.","엄마와 장을 보러 갔는데 사 달라고 조르고 싶어요. 알맞은 행동은?":"조르면 부모님이 힘들어져요. 차분히 말하고 안 된다고 하면 받아들이는 것이 서로를 존중하는 일이에요.","카페에서 일회용 컵을 쓰는 게 아까워요. 어떻게 할까요?":"일회용 컵은 한 번 쓰고 버려서 쓰레기도 돈도 낭비돼요. 내 컵을 가져가면 환경을 지키면서 할인도 받을 수 있어요.","친구가 돈을 빌려 달라고 해요. 마음이 불편할 때는?":"돈을 빌려주면 못 돌려받을 수도 있고 사이가 나빠질 수도 있어요. 줄 수 있는 만큼만 돕고 어른과 의논하면 안전해요.","쓰던 가방이 낡았지만 아직 쓸 만해요. 어떻게 할까요?":"아직 쓸 만한 물건을 버리고 새로 사면 돈이 낭비돼요. 고쳐 쓸 수 있으면 고치고 정말 못 쓸 때 사면 돼요.","친구가 내 앞에서 새 물건을 자랑해요. 부러울 때는?":"부러운 마음은 누구나 느껴요. 그 마음을 인정하고 내가 가진 것의 좋은 점을 떠올리면 비교하는 마음이 줄어들어요.","마트 시식 코너에서 맛있어서 사고 싶어졌어요. 어떻게 할까요?":"시식은 맛있게 느끼게 해서 사게 만들어요. 이미 집에 있는지 확인하고 필요한 만큼만 사면 낭비를 막을 수 있어요.","내가 모은 돈으로 친구에게 한턱내고 싶어요. 어떻게 할까요?":"친구에게 마음을 쓰는 것은 좋지만 내 계획을 넘으면 나중에 힘들어요. 알맞은 금액으로 정하면 마음도 전하고 계획도 지킬 수 있어요.","세뱃돈을 많이 받았어요. 알맞은 방법은?":"세뱃돈을 모두 쓰면 아깝고 모두 모으면 아쉬워요. 부모님과 상의해 저축할 몫과 쓸 몫을 나누면 현명해요.","가게 주인이 '지금 안 사면 후회한다'고 말해요. 어떻게 할까요?":"'지금 안 사면 후회한다'는 말은 마음을 급하게 만들려는 말이에요. 서두르지 않고 필요한지 천천히 따져 보면 후회하지 않아요.","가족이 쓰는 전기를 아끼자는 이야기가 나왔어요. 내가 할 일은?":"전기를 아끼는 것은 작은 행동에서 시작돼요. 쓰지 않는 불과 전자기기를 끄는 일은 누구나 쉽게 할 수 있고 가족의 전기요금도 줄여요.","학교 바자회에서 내 물건을 팔기로 했어요. 값은 어떻게 정할까요?":"새것과 비교해야 알맞은 값을 정할 수 있어요. 정직하게 상태를 말해야 사는 사람도 만족하고 신용도 쌓여요.","친구와 돈 문제로 말다툼이 생겼어요. 알맞은 행동은?":"화난 상태에서 말하면 더 크게 다투게 돼요. 감정이 가라앉은 뒤 이야기하고 약속을 다시 정하면 같은 문제가 또 생기지 않아요.","시험을 잘 보면 용돈을 올려 준다고 해요. 알맞은 마음은?":"용돈 때문에 공부하면 용돈이 없을 때 하기 싫어져요. 나를 위해 열심히 하고 결과를 감사히 받으면 마음이 오래 가요.","쓰고 싶은 돈이 계획한 금액을 넘었어요. 어떻게 할까요?":"다음 주 몫을 미리 쓰면 다음 주가 모자라서 계속 빌려 쓰게 돼요. 이번엔 참고 다음 계획에 반영하면 계획이 무너지지 않아요.","갖고 싶던 물건이 세일이에요. 용돈은 충분해요. 어떻게 할까요?":"세일이라고 싸게 사도 필요 없으면 낭비예요. 용돈이 충분해도 정말 필요한지 먼저 확인하는 습관이 중요해요.","친구가 비싼 게임기를 가졌어요. 나도 갖고 싶을 때는?":"갖고 싶은 이유를 적어 보면 진짜 필요한 건지 부러워서인지 알 수 있어요. 가족과 이야기하면 방법도 함께 찾을 수 있어요.","필요한 게 생겼는데 돈이 모자라요. 어떻게 할까요?":"모자라면 조금 더 모으는 것이 가장 안전해요. 빌려야 한다면 어른과 의논하고 갚을 방법을 먼저 정해야 해요.","돈을 빌려줬는데 친구가 갚기로 한 날을 잊었어요. 어떻게 할까요?":"잊어버렸을 수도 있어요. 화내지 않고 부드럽게 다시 알려 주면 사이도 지키고 돈도 돌려받을 수 있어요.","엄마 심부름으로 거스름돈이 남았어요. 알맞은 행동은?":"남은 돈과 영수증을 돌려드리면 정직하다는 믿음을 얻어요. 이런 작은 행동이 신용을 쌓아요.","새로 산 물건이 기대와 달라서 후회돼요. 다음에는?":"후기와 값을 알아보고 하룻밤 생각하면 정말 필요한지 알 수 있어요. 후회하는 소비를 줄이는 방법이에요.","내가 모은 돈을 친구들이 자랑해 보라고 해요. 어떻게 할까요?":"돈을 자랑하면 부러움을 사거나 쓰라는 부탁을 받기 쉬워요. 조용히 내 목표를 이어가면 흔들리지 않아요.","어른이 돈을 맡겨 놓고 쓰라고 하셨어요. 어떻게 할까요?":"남의 돈을 맡았을 때는 어디에 얼마를 썼는지 투명하게 알려 드려야 믿음이 생겨요. 이것이 신용이에요.","용돈을 받는 날을 자꾸 잊어요. 도움이 되는 방법은?":"달력에 표시하면 눈에 보여서 잊지 않아요. 저금 시간도 정해 두면 습관이 되기 쉬워요.","선물을 사려는데 예산이 정해져 있어요. 어떻게 고를까요?":"예산이 정해져 있으면 그 안에서 가장 좋은 선물을 고르는 연습이 돼요. 값이 아니라 마음이 중요해요.","주머니에 동전이 자꾸 생겨요. 어떻게 하면 좋을까요?":"동전이 흩어져 있으면 쓰기 쉬워요. 동전통에 매일 넣으면 작은 돈도 모이고 저축 습관도 생겨요.","친구와 같이 쓰는 물건을 샀어요. 알맞은 약속은?":"함께 쓰는 물건은 미리 규칙을 정하지 않으면 다투기 쉬워요. 돈을 낸 만큼과 쓰는 규칙을 미리 정하면 사이가 좋아져요.","가게에서 물건을 떨어뜨려 망가뜨렸어요. 어떻게 할까요?":"숨기면 더 큰 문제가 돼요. 솔직하게 말하고 어른과 함께 책임지면 신용도 지키고 문제도 해결돼요.","새 학기에 쓸 공책을 많이 사고 싶어요. 어떻게 할까요?":"쓰던 공책에 남은 장이 있으면 새로 살 필요가 없어요. 있는 것을 먼저 확인하면 낭비를 줄일 수 있어요.","용돈을 쓸 때마다 기분이 불안해요. 좋은 방법은?":"돈을 쓰기 전에 적어 두면 계획에서 벗어나는 걸 막고 쓴 뒤에 확인하면 불안이 줄어요. 눈에 보이면 마음이 편해져요.","내 저금 목표를 가족에게 알리고 싶어요. 어떻게 할까요?":"가족에게 알리면 응원도 받고 약속한 것처럼 지키게 돼요. 눈에 보이는 곳에 붙이면 매일 목표를 떠올려요.","친구가 내가 산 물건을 빌려 가고 싶어 해요. 어떻게 할까요?":"기간과 돌려줄 날을 정하면 잊거나 다투지 않아요. 약속을 지키면 서로 믿음이 생겨요.","갖고 싶은 게 두 개인데 돈은 하나만 살 수 있어요. 어떻게 고를까요?":"둘 다 사고 싶어도 하나만 살 수 있으면 오래 쓰고 꼭 필요한 쪽을 고르는 것이 이득이에요. 이때 포기한 것이 기회비용이에요.","돈을 아끼려고 너무 무리하게 굶었어요. 좋은 행동일까요?":"건강을 해치면 병원비가 더 들어요. 돈을 아끼는 건 낭비를 줄이는 거지 필요한 것을 참는 것이 아니에요.","아빠 지갑에서 돈이 떨어진 걸 봤어요. 어떻게 할까요?":"떨어진 돈은 주인에게 돌려줘야 해요. 정직하게 알려 드리면 신용이 쌓이고 마음도 떳떳해요.","우리 집 쓰레기를 줄여서 돈도 아끼고 싶어요. 방법은?":"쓰레기를 줄이면 물건을 덜 사게 되고 재활용으로 환경도 지켜요. 낭비를 줄이는 것이 돈을 아끼는 길이에요.","저금 계획을 세웠는데 며칠 못 지켰어요. 어떻게 할까요?":"며칠 못 지켰다고 포기하면 처음으로 돌아가요. 계획을 조금 쉽게 고쳐서 다시 하면 오래 이어 갈 수 있어요.","가격이 너무 싼 물건을 봤는데 이상해요. 어떻게 할까요?":"너무 싼 물건은 가짜이거나 사기일 수 있어요. 이상하다고 느끼면 사지 않고 어른께 물어보면 속지 않아요.","돈을 쓰기 전에 가족에게 허락받으라는 규칙이 있어요. 왜 필요할까요?":"큰 결정은 혼자 하면 실수하기 쉬워요. 가족과 함께 생각하면 놓친 것을 찾을 수 있어요.","내 용돈으로 친구 생일 선물을 사려고 해요. 어떻게 할까요?":"예산을 정하고 친구가 좋아하는 것을 떠올리면 값이 아니라 마음이 담긴 선물을 고를 수 있어요.","동네 가게에서 물건 값을 깎아 달라고 해 보고 싶어요. 알맞은 태도는?":"깎아 달라고 하는 것은 좋지만 예의가 중요해요. 안 된다고 하면 웃으며 받아들여야 서로 기분 좋게 거래할 수 있어요.","영수증을 받았어요. 왜 모아 두면 좋을까요?":"영수증이 있으면 얼마에 샀는지 확인할 수 있고 고장이나 교환할 때 증거로 쓸 수 있어요.","저축 목표를 이루었어요. 어떻게 하면 좋을까요?":"목표를 이루면 칭찬하며 기쁨을 느껴야 계속할 힘이 생겨요. 다음 목표를 정하면 저축이 끊기지 않아요.","용돈이 갑자기 늘어서 기뻐요. 어떻게 쓰면 좋을까요?":"용돈이 늘면 쓰고 싶은 마음도 커져요. 늘어난 만큼 저축도 같이 늘리면 쓰는 것과 모으는 것의 균형이 맞아요.","쇼핑 앱에 장바구니가 가득 찼어요. 어떻게 할까요?":"장바구니에 담아 두면 다 사고 싶어져요. 정말 필요한 것만 남기면 낭비를 막을 수 있어요.","내 물건을 오래 쓰려면 어떻게 하면 좋을까요?":"물건을 깨끗이 쓰고 정리하면 오래 쓸 수 있어서 새로 사는 돈이 줄어요. 아끼는 마음이 절약이에요.","친구가 몰래 산 물건을 자랑하며 비밀로 하래요. 어떻게 할까요?":"거짓말이 필요한 일은 숨겨야 해서 나쁜 일일 수도 있어요. 어른께 말씀드리면 문제가 커지기 전에 해결할 수 있어요.","돈 쓰는 일을 후회했어요. 도움이 되는 방법은?":"후회한 이유를 적어 보면 같은 실수를 줄일 수 있어요. 사기 전에 한 번 더 확인하는 습관이 생겨요.","내가 번 용돈이 처음 생겼어요. 가장 먼저 할 일은?":"처음 번 돈일수록 소중해요. 쓸 몫과 모을 몫을 먼저 나누면 돈 관리의 첫걸음을 잘 시작할 수 있어요.","가게에서 점원이 계산을 잘못한 것 같아요. 어떻게 할까요?":"점원도 실수할 수 있어요. 정중하게 다시 확인해 달라고 하면 기분 상하지 않고 정확한 계산을 받을 수 있어요.","용돈을 받으면 어디에 넣어 두면 좋을까요?":"저금통에 넣어 두면 쓰기 어려워서 돈이 쌓여요. 용돈은 아껴서 쓰면서 조금씩 모아요.","갖고 싶은 게 생기면 먼저 무엇을 할까요?":"갖고 싶은 마음이 들 때 필요한지 먼저 생각하면 충동소비를 막을 수 있어요.","쓰지 않는 불은 어떻게 할까요?":"켜 둔 불은 전기를 쓰고 있어요. 바로 끄면 전기를 아끼고 환경도 지켜요.","친구에게 빌린 물건은 어떻게 할까요?":"빌린 물건은 남의 것이에요. 깨끗이 쓰고 약속한 날 돌려주면 신용이 쌓여요.","동전이 생기면 어디에 모을까요?":"동전만 따로 모으면 눈에 보이게 쌓이고 작은 돈의 힘을 느낄 수 있어요.","사고 싶은 물건이 너무 비쌀 때 좋은 방법은?":"너무 비싼 물건은 한 번에 살 수 없어요. 조금씩 모으면 결국 살 수 있고 기다리면서 정말 필요한지도 생각할 수 있어요.","내 물건은 어떻게 쓰면 좋을까요?":"물건을 소중히 쓰면 오래 써서 새로 사는 돈이 줄어요. 아끼는 마음이 절약이에요.","어른이 선물을 사 주셨어요. 어떻게 할까요?":"선물을 받으면 고마운 마음을 표현하는 것이 예의예요. 감사하면 주는 사람도 기뻐요.","길에서 돈을 주웠어요. 어떻게 할까요?":"길에서 주운 돈은 내 돈이 아니에요. 어른께 말해 주인을 찾아 주는 것이 정직한 행동이에요.","간식을 살 때 알맞은 양은?":"먹을 만큼만 사면 남기지 않아서 음식이 낭비되지 않고 돈도 아껴요.","비싼 물건을 많이 가진 사람은 꼭 돈이 많은 걸까요?":"비싼 물건은 눈에 보이지만 그것을 산 돈은 이미 사라졌어요. 진짜 돈이 많은 사람은 쓰지 않고 모아 둔 돈이 많아서 겉으로는 평범해 보일 수도 있어요.","진짜 '부'는 어디에 있을까요?":"진짜 부는 가진 물건이 아니라 쓰지 않고 남겨 둔 돈이에요. 남겨 둔 돈이 있어야 급한 일에도 걱정이 없어요.","돈이 '충분하다'고 느끼는 것이 왜 중요할까요?":"'충분하다'고 느끼지 못하면 계속 더 가지려고 무리하게 돼요. 만족할 줄 알면 소중한 시간과 건강을 지킬 수 있어요.","친구가 가진 것과 내 것을 계속 비교하면 어떻게 될까요?":"비교는 끝이 없어요. 내 위에는 늘 더 가진 사람이 있기 때문에 계속 비교하면 늘 부족하다고 느껴요.","저축은 사고 싶은 게 있을 때만 해야 할까요?":"이유가 없어도 모아 두면 갑자기 일이 생겨도 선택할 수 있어요. 이것을 '선택의 자유'라고 해요.","돈으로 살 수 있는 가장 큰 선물은 무엇일까요?":"돈으로 시간을 사 주는 것은 아니지만 돈이 있으면 하기 싫은 일을 덜 하고 내 시간을 스스로 선택할 수 있어요. 이것이 큰 가치예요.","계획이 어긋날 때를 위해 꼭 필요한 것은?":"계획은 자주 어긋나요. 돈과 시간을 넉넉히 남겨 두면 어긋나도 괜찮아요. 이것이 '안전마진'이에요.","시험이나 투자에서 좋은 결과가 나왔을 때 알맞은 생각은?":"좋은 결과에는 내 노력도 있지만 운도 섞여 있어요. 운을 인정하면 으스대지 않고 다음에도 조심할 수 있어요.","나쁜 결과가 나왔을 때 알맞은 생각은?":"나쁜 결과가 모두 내 탓은 아니에요. 운이 나빴을 수도 있어요. 그래도 배울 점을 찾으면 다음에 더 잘할 수 있어요.","복리의 힘이 크게 나타나려면 무엇이 필요할까요?":"복리는 시간이 길수록 효과가 커져요. 처음엔 조금씩 늘지만 아주 오래 기다리면 눈덩이처럼 커져요.","어제 잘 맞았던 방법이 내일도 꼭 맞을까요?":"세상은 계속 바뀌어요. 어제 잘 맞았던 방법이 내일도 맞는다는 보장이 없어서 계속 배워야 해요.","물건을 사기 전에 가장 먼저 물어볼 말은?":"사기 전에 '왜 사고 싶은 걸까?'라고 물으면 진짜 필요인지 부러움인지 알 수 있어요.","돈 이야기에서 가장 중요한 것은 숫자일까요?":"돈 이야기는 숫자보다 마음과 행동이 중요해요. 같은 용돈이라도 어떻게 쓰느냐에 따라 달라져요.","부자가 되려면 한 번에 크게 맞히는 게 중요할까요?":"한 번에 크게 맞히려는 마음은 위험해요. 오래 버티며 꾸준히 하는 사람이 결국 이겨요.","월급이 올랐는데 그만큼 다 써 버리면 어떻게 될까요?":"수입이 늘어도 지출이 같이 늘면 남는 돈이 없어요. 늘어난 만큼 저축을 늘리면 여유가 생겨요.","번 돈의 일부를 먼저 나에게 떼어 두는 것은 왜 좋을까요?":"먼저 나에게 떼어 두면 나중의 내가 쓸 돈이 쌓여요. 이것이 선저축이에요.","돈이 나를 위해 일하게 하려면 어떻게 할까요?":"모은 돈이 이자나 수익으로 불어나면 돈이 나를 대신해 일해요. 이것이 '일하는 돈'이에요.","모르는 곳에 큰돈을 넣으라는 말을 들으면?":"이해하지 못하는 곳에 큰돈을 넣는 것은 위험해요. 잘 알아보고 이해될 때까지 기다리면 사기를 피할 수 있어요.","돈이 진짜 많은 사람들은 어떻게 사는 경우가 많을까요?":"돈이 정말 많은 사람은 오히려 알뜰하게 사는 경우가 많아요. 돈을 모으고 지키는 방법을 알기 때문이에요.","큰 집과 비싼 차가 있으면 꼭 부자일까요?":"비싼 집과 차를 빚으로 샀을 수도 있어요. 빚을 갚느라 정작 돈이 없을 수 있어서 겉모습만으로 알 수 없어요.","값이 크게 내렸다는 소식에 겁이 날 때 알맞은 행동은?":"급하게 팔면 손해를 확정해요. 값이 내려도 차분히 생각하고 계획을 지키면 다시 오르는 것을 기다릴 수 있어요.","모두가 값이 오른다며 사려고 할 때 나는?":"모두가 산다고 따라 사면 가장 비쌀 때 살 수 있어요. 내가 이해한 것인지 먼저 확인해요.","큰 변화를 만드는 가장 쉬운 방법은?":"작은 행동도 매일 하면 쌓여서 큰 변화가 돼요. 시작하기 쉬운 작은 행동이 가장 오래 가요.","저금을 잊지 않으려면 어떻게 할까요?":"용돈 받는 날 바로 저금통에 넣도록 정하면 잊어버릴 수 없어요. 습관은 '정해 두기'로 만들기 쉬워요.","지금 간식 하나 대신 기다리면 두 개를 준대요. 알맞은 생각은?":"지금 참으면 더 큰 보상이 와요. 이것이 '만족 지연'이에요. 참을성이 저축과 성공의 힘이에요.","돈에 대해 어릴 때부터 배우면 왜 좋을까요?":"어릴 때부터 배우면 어른이 되어 돈 때문에 하는 큰 실수를 줄일 수 있어요. 연습할수록 잘해요.","돈은 어떻게 번 것일까요?":"돈은 누군가 일하고 노력한 시간의 결과예요. 그래서 돈을 쓸 때 고마운 마음을 가지면 함부로 쓰지 않게 돼요.","돈이 없으면 불편한 점은?":"돈이 없으면 먹고 입고 사는 데 필요한 것을 마련하기 어려워요. 그래서 돈을 잘 관리하는 것이 중요해요.","돈이 많아도 해결되지 않는 것은?":"돈이 많아도 가족의 사랑, 건강, 우정은 살 수 없어요. 그래서 돈보다 소중한 것도 지켜야 해요.","부자란 어떤 사람일까요?":"부자는 돈이 많은 사람만이 아니에요. 필요한 것을 마련하고 마음이 여유로운 사람이 진짜 부자예요.","용돈을 받을 때 가장 좋은 마음은?":"용돈은 부모님이 일해서 번 돈이에요. 고마워하는 마음으로 받으면 소중하게 쓰게 돼요.","돈을 쓸 때 가치를 따진다는 말은?":"가치를 따진다는 것은 쓴 돈만큼 만족이나 도움이 되는지 생각하는 거예요. 값이 비싸다고 가치가 큰 것은 아니에요.","시간도 돈처럼 쓸 수 있을까요?":"시간도 하루 24시간으로 정해져 있어요. 시간도 돈처럼 소중한 곳에 써야 해요.","돈보다 소중한 것의 예는?":"건강, 가족, 친구, 믿음은 돈으로 살 수 없지만 가장 소중해요. 돈은 이것들을 지키는 도구일 뿐이에요.","욕심이 지나치면 어떻게 될까요?":"욕심이 지나치면 아무리 가져도 부족하다고 느껴요. 가진 것에 만족하는 마음이 행복의 열쇠예요.","'충분하다'고 느끼는 마음은 왜 좋을까요?":"'충분하다'고 느끼면 비교하지 않고 편안해요. 지금 가진 것에 감사하는 마음이에요.","돈을 모으는 이유로 알맞은 것은?":"돈을 모으는 가장 큰 이유는 하고 싶은 일을 고를 수 있는 자유를 키우기 위해서예요.","돈 쓰는 모습은 무엇을 보여 줄까요?":"돈을 쓰는 모습을 보면 그 사람이 무엇을 소중히 여기는지 알 수 있어요. 내 돈 쓰는 모습도 돌아봐요.","'돈은 도구'라는 말의 뜻은?":"돈은 도구예요. 칼처럼 어떻게 쓰느냐에 따라 도움이 될 수도 해가 될 수도 있어요. 돈 자체가 목적은 아니에요.","내가 가진 것에 감사하면 달라지는 점은?":"가진 것에 감사하면 더 갖고 싶은 마음이 줄고 마음이 편해져요. 감사하는 습관이 절약에도 도움이 돼요.","돈 걱정이 많은 친구에게 해 줄 말은?":"돈 걱정은 혼자 안고 있으면 더 커져요. 도움을 청해도 괜찮다고 말해 주고 함께 방법을 찾으면 힘이 돼요.","돈이 모자랄 때 가장 먼저 해야 할 생각은?":"모자랄 때는 꼭 필요한 것과 없어도 되는 것을 나누어야 우선순위가 보여요.","일을 하고 받은 돈이 더 값진 이유는?":"일하고 받은 돈에는 시간과 땀이 담겨 있어요. 그래서 소중하게 쓰게 돼요.","돈을 함부로 쓰면 안 되는 이유는?":"돈에는 번 사람의 시간과 노력이 담겨 있어요. 그래서 함부로 쓰면 그 노력을 가볍게 여기는 거예요.","돈으로 행복을 전부 살 수 있을까요?":"돈은 행복의 한 부분을 도와줘요. 하지만 건강, 가족, 우정은 돈으로 살 수 없어요.","갖고 싶은 마음이 들 때 알맞은 질문은?":"갖고 싶은 마음이 들 때 '이걸 갖고 나면 정말 더 행복해질까?' 물으면 진짜 필요인지 알 수 있어요.","돈을 나누면 마음은 어떻게 될까요?":"나누면 주는 사람도 기쁘고 마음이 따뜻해져요. 나눔은 서로를 행복하게 해요.","가난하다고 부끄러워해야 할까요?":"가난은 부끄러운 일이 아니에요. 형편은 사람마다 다르고 노력하는 마음이 더 소중해요.","필요 없는 물건을 샀을 때 생기는 일은?":"필요 없는 물건은 돈뿐 아니라 보관할 공간과 정리하는 시간까지 낭비돼요.","돈을 쓰는 연습은 왜 필요할까요?":"쓰는 연습을 어릴 때부터 해 보면 어른이 되었을 때 큰 실수를 줄일 수 있어요.","돈의 가치는 어디서 올까요?":"돈의 가치는 사람들이 그 돈으로 필요한 것을 바꿀 수 있다고 믿는 데서 와요. 서로 믿기 때문에 종이도 돈이 되는 거예요.","가족이 열심히 일하는 모습을 보면 어떤 생각이 들어야 할까요?":"가족이 열심히 일해서 번 돈이에요. 고마운 마음을 가지면 돈을 소중하게 써야겠다고 생각하게 돼요.","돈이 생기면 사람의 마음이 달라질 수 있을까요?":"돈이 생기면 마음이 달라지기 쉬워요. 중심을 잘 잡으면 돈에 휘둘리지 않아요.","돈을 쓰는 기준이 있으면 좋은 점은?":"쓰는 기준이 있으면 광고나 친구에게 흔들리지 않고 필요한 곳에 쓸 수 있어요.","아끼는 것과 인색한 것은 어떻게 다를까요?":"아끼는 것은 필요한 곳에 쓰려고 줄이는 것이고, 인색한 것은 쓸 곳에도 안 쓰는 거예요. 그 차이가 중요해요.","내 용돈이 적어 보일 때 알맞은 생각은?":"적은 돈도 계획해서 잘 쓰면 큰 도움이 돼요. 금액이 아니라 쓰는 방법이 중요해요.","돈을 오래 모으면 얻는 것은?":"오래 모으면 돈뿐 아니라 기다리는 힘과 계획하는 힘도 함께 길러져요. 이 힘이 평생 도움이 돼요.","'공짜 점심은 없다'는 말의 뜻은?":"공짜처럼 보여도 누군가가 비용을 내거나 나중에 다른 걸 사게 만들어요. 아무것도 안 하고 얻을 수 있는 것은 없어요.","돈보다 시간이 더 중요할 때는?":"돈보다 시간이 더 소중할 때도 있어요. 가족, 친구와 함께하는 순간은 돈으로 다시 살 수 없어요.","물건을 오래 쓰면 돈에 어떤 도움이 될까요?":"물건을 오래 쓰면 새로 사는 횟수가 줄어서 돈이 절약돼요.","돈이 아깝다고 느낄 때 알맞은 행동은?":"아깝다고 느껴지면 그 돈으로 무엇을 얻었는지 돌아봐요. 만족했다면 괜찮고 아니라면 다음엔 달리하면 돼요.","돈을 번다는 것은 사회에서 어떤 일일까요?":"돈을 번다는 것은 누군가에게 도움이 되는 일을 하고 그 대가를 받는 것이에요. 일은 서로를 돕는 일이에요.","돈이 필요한 이유가 사람마다 다른 까닭은?":"사람마다 소중하게 생각하는 것이 달라서 돈이 필요한 이유도 달라요. 서로 다르다는 것을 이해해요.","돈에 대해 이야기하는 것은 나쁜 일일까요?":"돈 이야기를 잘하면 모르는 것을 배우고 현명하게 쓸 수 있어요. 부끄러워할 일이 아니에요.","작은 돈도 소중히 하는 사람의 마음은?":"작은 돈도 소중히 하는 사람은 작은 것이 쌓여 큰 것이 된다는 걸 알아요.","돈이 모자랄 때 친구에게 솔직히 말하는 것은 어떤 용기일까요?":"모자란다고 솔직하게 말하는 것은 용기예요. 부끄러워하지 않고 내 상황을 말하면 서로 이해할 수 있어요.","내일을 위해 오늘 조금 참는 것은 어떤 마음일까요?":"오늘 조금 참으면 내일 더 큰 것을 얻을 수 있어요. 이것이 기다리는 마음, 만족 지연이에요.","돈을 쓸 때 다른 사람 눈치만 보면 어떻게 될까요?":"남의 눈치만 보면 내가 원하는 것이 아니라 남이 좋아할 것을 사게 돼요. 내 기준이 중요해요.","돈으로 살 수 있는 행복과 살 수 없는 행복의 예는?":"돈으로 간식은 살 수 있지만 가족의 사랑은 살 수 없어요. 그래서 돈보다 소중한 것을 지켜야 해요.","일하는 사람들에게 고마워해야 하는 이유는?":"일하는 사람들 덕분에 우리가 필요한 것을 구할 수 있어요. 고마워하는 마음이 필요해요.","돈 이야기를 가족과 하면 좋은 점은?":"돈 이야기를 가족과 하면 모르는 것을 배우고 서로의 사정도 이해할 수 있어요.","돈이 생기면 가장 먼저 할 일은?":"돈이 생기면 어디에 쓸지 생각하고 일부는 먼저 모아 두면 쓰고 남은 돈이 없는 일을 막을 수 있어요.","쓰지 않고 모은 돈이 주는 마음은?":"모아 둔 돈이 있으면 갑자기 일이 생겨도 든든해요. 이것이 마음의 안전망이에요.","돈 때문에 거짓말을 하고 싶을 때는?":"거짓말은 일시적으로 편하지만 들키면 신용을 잃어요. 솔직하게 말하는 것이 더 큰 믿음을 얻는 길이에요.","물건의 값과 가치는 같을까요?":"값은 가격표에 적힌 숫자이고 가치는 나에게 얼마나 쓸모 있는지예요. 값이 싸도 쓸모가 없으면 가치가 낮아요.","돈이 있어도 사지 말아야 할 것은?":"돈이 있어도 나나 남에게 해로운 것은 사면 안 돼요. 돈은 좋은 곳에 써야 해요.","어른들이 돈을 아끼라고 말씀하시는 이유는?":"어른들이 아끼라고 하는 것은 나중에 필요한 일이 생길 때를 대비하라는 사랑이에요.","돈이 많은 친구가 부러울 때 알맞은 생각은?":"돈이 많은 친구가 부러워도 돈이 전부가 아니에요. 내 장점과 가진 것을 떠올리면 마음이 편해져요.","적은 돈으로 즐겁게 지내는 방법은?":"돈이 들지 않는 놀이도 많아요. 가족과 함께하는 시간이 더 오래 기억에 남을 수 있어요.","돈과 관련된 약속이 중요한 이유는?":"돈과 관련된 약속을 지키면 믿음이 쌓여요. 믿음이 있으면 서로 편하게 지낼 수 있어요.","내가 번 돈과 받은 돈은 어떻게 다를까요?":"내가 일해서 번 돈과 선물로 받은 돈은 소중함의 느낌이 달라요. 번 돈에는 내 노력이 담겨 있어요.","돈을 쓸 때 환경도 생각해야 하는 이유는?":"물건을 만드는 데는 자원이 들어가요. 낭비하면 지구에 부담이 되므로 꼭 필요한 만큼만 사면 환경도 지켜요.","빌린 돈이 마음에 주는 영향은?":"빌린 돈은 갚을 때까지 마음이 무거워요. 그래서 꼭 필요할 때만 빌리고 갚을 계획을 세워야 해요.","돈이 필요 없다고 말하는 사람은 어떤 마음일까요?":"돈이 필요 없다고 말하는 사람도 사실은 돈에 휘둘리지 않으려는 마음일 수 있어요.","내가 쓰는 돈이 다른 사람에게 미치는 영향은?":"내가 쓰는 돈은 물건을 만들고 파는 사람들의 일자리와 연결돼 있어요. 돈은 세상과 이어져 있어요.","돈을 쓰기 전에 마음을 가라앉히면 좋은 점은?":"사고 싶은 마음이 올라올 때 잠깐 마음을 가라앉히면 충동에 휘둘리지 않고 판단할 수 있어요.","돈에 대한 좋은 습관은 누구에게 영향을 줄까요?":"좋은 돈 습관은 나뿐 아니라 가족과 미래의 내 아이에게도 이어져요. 습관은 가장 큰 유산이에요.","돈이 부족해도 포기하지 말아야 할 것은?":"돈이 부족해도 배우려는 마음과 노력하는 힘이 있으면 나중에 길을 찾을 수 있어요.","내 꿈에 필요한 돈이 많아 보일 때는?":"큰 꿈에 필요한 돈이 많아 보여도 작게 나누어 하나씩 모으면 가능해요.","돈을 잘 쓰는 사람이 되려면?":"쓰기 전에 필요한지와 가치를 한 번 더 생각하면 후회하는 소비가 줄어요.","돈이 사람 사이에 문제를 만들 때 알맞은 해결은?":"돈 때문에 사이가 나빠지면 솔직하게 이야기하고 이해하려고 노력해야 해요.","용돈을 처음 받는 날의 마음가짐은?":"처음 받은 용돈에 고마워하고 계획을 세워 쓰는 마음이 평생 돈 습관의 시작이에요.","돈 공부를 지금 하는 이유는?":"어른이 되면 스스로 결정해야 하는 일이 많아요. 지금부터 배우면 그때 잘 결정할 수 있어요.","용돈은 누가 일해서 번 돈일까요?":"용돈은 부모님이 일해서 번 돈에서 나와요. 그래서 고마운 마음으로 써야 해요.","돈이 있으면 무엇을 할 수 있을까요?":"돈이 있으면 먹을 것, 입을 것, 학용품 같은 필요한 물건을 살 수 있어요.","돈으로 살 수 없는 것은 무엇일까요?":"친구의 마음과 가족의 사랑은 돈으로 살 수 없어요. 돈보다 소중한 것이에요.","용돈을 받으면 부모님께 뭐라고 말할까요?":"받은 용돈에 대해 고맙다고 말하면 주신 분도 기뻐해요. 고마운 마음을 표현하는 것이 좋은 습관이에요.","내 간식을 동생과 나누면 어떤 기분일까요?":"나누면 마음이 따뜻해져요. 간식을 나누는 작은 행동도 나눔이에요.","돈이 없어도 즐겁게 놀 수 있을까요?":"즐겁게 노는 데 돈이 꼭 필요한 것은 아니에요. 친구와 함께하면 즐거워요.","물건을 사면 내 돈은 어떻게 될까요?":"물건을 사면 내 돈은 줄어들어요. 그래서 사기 전에 꼭 필요한지 생각해야 해요.","저금통에 돈을 계속 넣으면 어떻게 될까요?":"저금통에 돈을 계속 넣으면 점점 쌓여요. 조금씩 넣어도 시간이 지나면 많아져요.","돈을 잃어버리면 어떤 기분일까요?":"돈을 잃어버리면 속상하고 아까워요. 그래서 돈을 소중히 챙겨야 해요.","돈을 아끼면 좋은 점은 무엇일까요?":"돈을 아끼면 나중에 꼭 필요할 때 쓸 수 있어요. 아끼는 것은 미래의 나를 돕는 일이에요.","어제 한 선택은 오늘의 나에게 어떤 영향을 줄까요?":"어제 한 선택은 오늘의 내 모습을 만든 원인이에요. 오늘 저금하면 내일의 내가 돈이 있고, 오늘 낭비하면 내일의 내가 부족해요.","오늘 내가 하는 행동은 내일의 나에게 무엇이 될까요?":"오늘의 작은 행동은 씨앗과 같아요. 물을 주면 자라듯이 오늘 한 저금과 공부가 내일의 나를 만들어요.","과거의 실수를 떠올릴 때 알맞은 마음은?":"실수를 계속 후회만 하면 앞으로 나아가기 어려워요. 배운 점으로 삼고 오늘을 더 잘 살면 실수가 힘이 돼요.","미래가 걱정될 때 오늘 할 수 있는 일은?":"미래는 걱정만 한다고 달라지지 않아요. 오늘 할 수 있는 작은 일 하나가 걱정을 줄여 줘요.","'현재'가 중요한 이유는?":"과거는 바꿀 수 없고 미래는 아직 오지 않았어요. 내가 바꿀 수 있는 시간은 지금뿐이에요.","실수를 했을 때 가장 좋은 태도는?":"실수를 숨기면 더 커져요. 솔직히 인정하고 고칠 방법을 생각하면 같은 실수를 줄일 수 있어요.","다른 사람과 비교하는 습관을 줄이려면?":"비교하는 습관을 줄이려면 어제의 나와 비교해 보세요. 나아진 점을 찾으면 마음이 편해져요.","내 장점을 모르겠을 때 해 볼 일은?":"장점은 잘했던 일에서 찾을 수 있어요. 적어 보면 내가 잘하는 것이 눈에 보여요.","친구의 성공이 질투날 때 좋은 마음은?":"질투는 누구나 느끼지만 축하해 주고 배울 점을 찾으면 나도 함께 성장해요.","'감사하는 마음'에는 어떤 힘이 있을까요?":"감사하는 마음은 작은 일에서도 행복을 느끼게 해요. 가진 것에 감사하면 불평이 줄어요.","하루 끝에 감사한 일을 적으면 좋은 점은?":"하루 끝에 감사한 일을 적으면 좋은 일을 더 잘 알아보게 돼요. 매일 하면 행복한 일이 늘어나요.","힘든 일이 계속될 때 알맞은 생각은?":"힘든 일은 영원히 계속되지 않아요. 지나갈 거라고 믿으면 포기하지 않고 버틸 수 있어요.","나만의 기준을 세우는 것은 왜 좋을까요?":"나만의 기준이 있으면 남의 말에 덜 흔들려요. 돈을 쓸 때도 내 기준이 도움이 돼요.","어떤 물건의 가치를 정할 때 해 볼 일은?":"물건의 가치는 나에게 얼마나 필요하고 오래 쓰는지로 정해져요. 값이 비싸다고 가치가 큰 것은 아니에요.","하고 싶은 일이 너무 많을 때 좋은 방법은?":"하고 싶은 일이 많으면 다 못 해요. 가장 중요한 것부터 순서를 정하면 해낼 수 있어요.","해야 할 일이 많아서 힘들 때 먼저 할 일은?":"일이 너무 많으면 하지 말아야 할 일부터 줄이면 시간이 생겨요. 줄이는 것도 선택이에요.","나쁜 습관을 고치려면?":"나쁜 습관을 한꺼번에 고치려면 힘들어요. 하나만 정해서 먼저 멈추면 성공하기 쉬워요.","나와 맞지 않는 사람에게서도 배울 수 있을까요?":"맞지 않는 사람에게서도 배울 점이 있어요. 좋은 점은 따라 하고 나쁜 점은 나는 하지 않으면 돼요.","선생님께 야단맞았을 때 알맞은 생각은?":"야단맞았을 때는 왜 그랬는지 생각해 보면 고칠 점을 알 수 있어요. 고치면 더 성장해요.","친구의 고민을 들어줄 때 가장 좋은 태도는?":"끝까지 들어 주는 것만으로도 큰 위로가 돼요. 서두르지 않는 태도가 좋은 친구의 모습이에요.","내 고민을 친구 일처럼 보면 좋은 점은?":"내 일은 감정 때문에 잘 안 보여요. 친구 일처럼 한 걸음 떨어져서 보면 해결책이 보여요.","친구에게 조언할 때는 어떤 마음일까요?":"조언은 그 친구를 돕고 싶은 마음에서 나와요. 그래서 따뜻하게 말해야 해요.","스스로에게 하는 말이 중요한 이유는?":"내가 나에게 하는 말은 마음과 행동에 가장 가까이 영향을 줘요. 좋은 말을 해 주면 힘이 나요.","실패했을 때 나에게 해 줄 말은?":"실패했을 때 자신을 비난하면 더 하기 싫어져요. '괜찮아, 다시 해 보면 돼'라고 말해 주면 다시 도전할 힘이 생겨요.","나를 칭찬하는 것은 왜 필요할까요?":"잘한 일을 칭찬하면 기분이 좋아지고 계속할 힘이 생겨요. 칭찬은 나를 키우는 힘이에요.","다른 사람의 시선이 신경 쓰일 때는?":"남의 시선은 바뀌지만 내가 정직하고 성실했는지는 변하지 않는 기준이에요.","내 성격이 마음에 안 들 때 알맞은 생각은?":"성격을 한꺼번에 바꾸기는 어려워요. 바꾸고 싶은 점은 조금씩 고치고 좋은 점은 키우면 돼요.","노력과 결과의 관계로 알맞은 것은?":"노력은 내가 할 수 있지만 결과에는 운도 섞여 있어요. 그래서 노력에 집중하면 마음이 편해요.","결과가 나빠도 노력했다면?":"결과가 나빠도 노력한 과정에서 배운 것은 남아요. 그 배움이 다음에 도움이 돼요.","작은 목표를 이루면 좋은 점은?":"작은 목표를 이루면 자신감이 생겨요. 그 자신감이 큰 목표에 도전할 힘이 돼요.","내가 정말 좋아하는 일을 찾으려면?":"좋아하는 일은 해 봐야 알 수 있어요. 여러 가지를 해 보면서 즐거운 것을 찾아봐요.","친구가 나를 무시할 때 알맞은 행동은?":"무시당하면 속상하지만 화내면 더 나빠져요. 차분히 내 마음을 말하고 필요하면 어른께 도움을 청해요.","내가 가진 것 중 가장 소중한 것을 떠올린다면?":"가장 소중한 것은 가족, 친구, 건강처럼 돈으로 살 수 없는 것이에요. 그래서 돈은 이것들을 지키는 데 써야 해요.","'내 인생을 산다'는 말의 뜻은?":"내 인생을 산다는 것은 남이 아니라 내가 선택하고 책임진다는 뜻이에요.","다른 사람의 인생이 부러울 때 기억할 것은?":"남의 인생은 보이는 모습이 전부가 아니에요. 모두에게 저마다 사정이 있어요.","매일 같은 일이 지루할 때 좋은 생각은?":"같은 일이 지루해도 당연한 일에도 소중한 점이 있어요. 그렇게 생각하면 감사한 마음이 생겨요.","당연하게 받은 것에 감사하려면?":"당연하게 받은 것도 없다면 어땠을지 상상하면 고마움을 느낄 수 있어요.","가족이 해 주는 밥에 대한 알맞은 마음은?":"밥에는 만든 사람의 정성이 들어 있어요. 고마워하는 마음을 가지면 음식을 남기지 않게 돼요.","오늘 있었던 작은 행복은 어떤 것들일까요?":"작은 행복은 가까이 있어요. 간식, 친구의 웃음, 햇살처럼 일상에서 찾을 수 있어요.","속상한 마음이 클 때 도움이 되는 방법은?":"속상할 때는 믿을 만한 사람에게 말하고 깊게 숨을 쉬면 마음이 가라앉아요.","일이 잘 풀릴 때 알맞은 마음은?":"잘될 때도 도와준 사람에게 고마워하고 겸손하면 오래 좋은 일이 이어져요.","다른 사람에게 상처 주는 말을 했을 때는?":"상처 주는 말을 했으면 진심으로 사과하고 다시는 그러지 않도록 노력해야 해요.","사과를 받는 입장이라면?":"사과를 받을 때는 마음을 열어 주되 힘들면 시간을 달라고 말해도 괜찮아요.","거절하기 어려운 부탁을 받았을 때는?":"거절은 어렵지만 내 마음과 형편을 솔직하게 정중하게 말하면 서로 이해할 수 있어요.","하루를 돌아보는 시간은 왜 필요할까요?":"하루를 돌아보면 잘한 점과 고칠 점을 알 수 있어요. 그래서 내일을 더 잘 준비할 수 있어요.","내가 바꿀 수 없는 일 앞에서 알맞은 마음은?":"바꿀 수 없는 일에 매달리면 힘만 들어요. 받아들이고 내가 할 수 있는 일에 집중하는 것이 좋아요.","미루는 습관이 있을 때 좋은 방법은?":"미루는 습관은 시작이 어려워서 생겨요. 5분만 하자고 작게 쪼개면 시작이 쉬워져요.","하고 싶은 일이 자주 바뀌는 건 이상한 걸까요?":"하고 싶은 일이 바뀌는 것은 새로운 것을 알아가는 중이라 자연스러운 일이에요.","약속을 지키지 못했을 때 먼저 할 일은?":"약속을 못 지킬 것 같으면 미리 알리고 사과해야 신용을 지킬 수 있어요. 그리고 다시 약속해요.","친구와 의견이 다를 때 알맞은 태도는?":"의견이 달라도 내 생각을 말하고 친구 생각도 들어 보면 서로 이해하게 돼요.","나에게 중요한 가치를 정한다면?":"정직, 성실, 배려 같은 가치를 정하면 어려울 때도 올바른 선택을 할 수 있어요.","칭찬을 받았을 때 좋은 반응은?":"칭찬을 받으면 고맙다고 말하고 더 잘하려고 노력하면 칭찬이 힘이 돼요.","질투가 났을 때 마음을 가라앉히는 방법은?":"질투가 날 때 내 좋은 점을 떠올리면 마음이 가라앉아요.","내 삶에서 내가 정할 수 있는 것은?":"모든 것을 정할 수는 없지만 어떤 마음으로 어떻게 행동할지는 내가 정할 수 있어요.","새로운 도전이 두려울 때는?":"새로운 도전은 두려워요. 작게 시작하고 실패해도 배우면 된다고 생각하면 용기가 나요.","힘들 때 도와주는 사람이 있다면?":"도움받은 것에 고마움을 표현하고 나도 다른 사람을 도우면 따뜻한 마음이 이어져요.","오늘 하루를 좋게 마무리하는 방법은?":"하루를 좋게 마무리하려면 잘한 일을 떠올리고 감사한 일을 적으면 마음이 편안해져요.","'지금의 나'를 있는 그대로 받아들이면 좋은 점은?":"지금의 나를 받아들이면 마음이 편해져서 오히려 더 나아질 힘이 생겨요.","남에게 베풀 때 얻는 마음은?":"남에게 베풀면 따뜻함과 뿌듯함이 나에게도 돌아와요. 나눔은 주는 사람도 행복하게 해요.","내 실수를 숨기고 싶을 때는?":"실수를 숨기면 더 커질 수 있어요. 용기를 내어 말하면 해결 방법을 함께 찾을 수 있어요.","다른 사람의 좋은 점을 찾는 습관의 좋은 점은?":"다른 사람의 좋은 점을 찾으면 나도 배우고 사이도 좋아져요.","너무 높은 목표가 막막할 때는?":"너무 높은 목표는 막막해요. 오늘 할 작은 일 하나로 나누면 시작할 수 있어요.","하기 싫은 일을 해야 할 때 마음가짐은?":"하기 싫은 일도 끝낸 뒤의 뿌듯함을 떠올리면 시작하기 쉬워요.","나에게 선물을 준다면 어떤 게 좋을까요?":"노력한 나에게 작은 휴식과 응원을 주면 다시 힘을 낼 수 있어요.","부모님께 감사한 점을 찾는다면?":"부모님은 키워 주고 걱정해 주세요. 그 마음에 감사하면 사이가 더 따뜻해져요.","친구와 비교해서 부족해 보일 때 기억할 것은?":"친구와 비교해서 부족해 보여도 나는 나만의 속도와 장점이 있어요.","지금 힘든 일이 미래에 도움이 될 수 있을까요?":"지금 힘든 일을 이겨 낸 경험은 나를 단단하게 만들어서 미래에 도움이 돼요.","후회가 되는 일이 있을 때 할 일은?":"후회가 되면 배운 점을 적고 앞으로 달라질 행동을 정하면 후회가 성장으로 바뀌어요.","내가 할 수 있는 작은 친절은?":"작은 친절은 누구나 할 수 있어요. 인사하기, 문 잡아 주기, 고맙다고 말하기가 있어요.","하루에 나만의 시간을 갖는 이유는?":"하루에 나만의 시간을 갖으면 내 마음을 살피고 생각을 정리할 수 있어요.","내일을 기다리는 마음을 만들려면?":"내일 하고 싶은 즐거운 일이 있으면 내일이 기다려져요. 작은 기대가 힘이 돼요.","친구가 나보다 잘해서 속상할 때는?":"친구가 나보다 잘해서 속상해도 축하해 주고 나도 연습하면 나도 성장해요.","잘못했을 때 어떻게 말할까요?":"잘못했을 때 솔직하게 사과하면 마음이 편해지고 믿음을 지킬 수 있어요.","오늘 고마운 일이 있었다면?":"고마운 일은 말로 표현하고 마음에 담아 두면 더 행복해져요.","새로운 것이 무서울 때는?":"처음 해 보는 것은 무서워요. 작게 먼저 해 보면 조금씩 익숙해져요.","친구와 싸웠을 때 좋은 방법은?":"화가 났을 때 말하면 더 싸워요. 가라앉은 뒤 차분히 이야기하면 해결이 쉬워요.","내가 잘하는 것을 찾고 싶을 때는?":"내가 잘하는 것은 생각해 보고 적어 보면 찾을 수 있어요.","실수해서 울고 싶을 때는?":"실수하고 속상할 때는 잠깐 쉬고 다시 해 보면 돼요. 실수는 누구나 해요.","나를 칭찬해 주고 싶을 때는?":"스스로를 칭찬하면 자신감이 생겨요. 잘한 일을 말로 해 보세요.","어제보다 나아진 점을 찾는다면?":"어제와 비교하면 내가 얼마나 나아졌는지 알 수 있어요. 어제 못했던 일을 오늘 했다면 성장한 거예요.","다른 사람을 도와주면 어떤 마음이 들까요?":"다른 사람을 도와주면 뿌듯하고 기분이 좋아져요. 작은 도움도 큰 기쁨이 돼요.","비싼 물건을 사는 것보다 돈이 더 큰 가치를 줄 때는 언제일까요?":"돈의 진짜 가치는 물건을 사는 것이 아니라 하기 싫은 일을 억지로 하지 않아도 되는 자유에서 나올 수 있어요. 이것이 돈이 주는 선택의 자유예요.","가진 것은 그대로인데 더 만족하며 사는 방법은?":"가진 것은 그대로여도 원하는 것을 줄이고 가진 것에 감사하면 더 만족하며 살 수 있어요.","멋진 물건을 자랑하는 사람은 왜 그럴 때가 많을까요?":"자랑하는 마음 뒤에는 인정받고 싶은 마음이 있을 때가 많아요. 그 마음을 알면 따라 하지 않을 수 있어요.","새 장난감이 처음엔 신나는데 점점 시들해지는 이유는?":"새 장난감이 시들해지는 이유는 마음이 금방 익숙해지기 때문이에요. 그래서 새것을 계속 사도 만족은 오래가지 않아요.","세상은 변해도 거의 변하지 않는 것은 무엇일까요?":"세상은 변하지만 사람의 마음과 행동은 거의 변하지 않아요. 그래서 옛날 이야기에서도 배울 수 있어요.","내일 무슨 일이 생길지 정확히 알 수 있을까요?":"내일 무슨 일이 생길지 정확히 알 수 없어요. 놀라운 일은 늘 생기니 비상금과 계획으로 대비해야 해요.","'계속 사라(저스트 킵 바잉)'는 어떤 뜻일까요?":"'계속 사라(Just Keep Buying)'는 좋은 때를 맞히려고 애쓰지 말고 꾸준히 사 모으라는 뜻이에요. 맞히기는 어렵지만 꾸준히 하는 것은 누구나 할 수 있어요.","돈을 모으기 시작할 때 가장 중요한 것은?":"돈을 모을 때는 투자 방법보다 꾸준히 저축하는 습관과 모으는 양이 더 중요해요.","하루에 아주 조금씩 나아지면 오랜 시간 뒤 어떻게 될까요?":"하루 1%씩만 나아져도 1년이면 크게 달라져요. 작은 변화가 쌓이면 큰 차이가 돼요.","습관을 쉽게 시작하는 방법은?":"습관은 눈에 잘 보이는 곳에 두고 아주 쉽게 시작하면 오래 이어져요. 쉬울수록 잘 돼요.","빠른 느낌(직관)만 믿으면 생길 수 있는 일은?":"직관은 빠르지만 실수할 수 있어요. 중요한 일은 한 번 더 차분히 생각해야 해요.","가진 것을 잃는 게 얻는 것보다 더 싫은 마음을 뭐라고 할까요?":"잃는 것이 얻는 것보다 더 싫은 마음이 손실 회피예요. 이 마음 때문에 손해가 무서워서 잘못 선택할 수 있어요.","처음 본 가격에 내 생각이 끌려가는 것을 뭐라고 할까요?":"처음 본 가격에 생각이 묶이는 것이 닻 내리기예요. 처음 가격과 상관없이 내게 알맞은 값인지 따져 봐요.","'공짜'라는 말에 끌려 필요 없는 것을 가져오면?":"공짜라도 필요 없으면 쓸데없는 소비예요. 공짜 효과에 속지 않으려면 필요한지 먼저 물어봐요.","비싼 것 옆에 있는 물건이 싸 보이는 이유는?":"비싼 것 옆에 있는 물건은 상대적으로 싸 보여요. 비교하면 가격을 제대로 따지기 어려워져요.","돈을 모으는 계획을 세울 때 꼭 필요한 것은?":"목표와 언제까지 할지를 정해야 매달 얼마를 모아야 하는지 알 수 있어요.","돈과 친해지려면 어떻게 하면 좋을까요?":"돈을 무서워하지 않고 배우고 계획하면 돈과 친해질 수 있어요.","수수료가 낮은 펀드가 좋은 이유는?":"펀드 수수료가 낮으면 내 몫이 덜 깎여요. 오래 두면 작은 차이가 큰 차이가 돼요.","더 큰 수익을 기대하려면 무엇을 받아들여야 할까요?":"더 큰 수익을 기대하려면 더 큰 위험도 받아들여야 해요. 위험 없이 큰 수익은 없어요.","투자할 때 마음이 흔들리지 않게 하려면?":"미리 계획을 세우고 그대로 지키면 시장이 흔들려도 마음이 덜 흔들려요.","다음 달 주식 값을 계속 맞히는 사람은 많을까요?":"주식 값을 계속 맞히는 사람은 거의 없어요. 그래서 맞히려는 것보다 꾸준히 하는 것이 낫습니다.","값을 맞히려고 애쓰는 대신 해 볼 수 있는 일은?":"값을 맞히려고 애쓰는 대신 여러 곳에 나누고 오래 가지고 있는 방법이 더 쉬워요.","내가 잘 아는 것에서 먼저 살펴보면 좋은 점은?":"내가 잘 아는 것에서 먼저 살펴보면 이해한 것만 고르게 되어 실수를 줄일 수 있어요.","어떤 회사에 관심이 생겼을 때 먼저 할 일은?":"회사에 관심이 생기면 먼저 그 회사가 무엇으로 돈을 버는지 공부해야 해요.","주식 값이 오르락내리락해도 아주 오래 보면?":"주식 값은 오르락내리락하지만 긴 시간으로 보면 올라온 적이 많았다고 해요. 그래서 오래 기다리는 것이 중요해요.","사람들이 비슷한 실수를 반복하는 이유는?":"사람들은 지난 일을 쉽게 잊어서 비슷한 실수를 반복해요. 그래서 기록하고 배우는 것이 중요해요.","'이번에는 다르다'는 말을 들으면?":"'이번에는 다르다'는 말은 위험할 때가 많아요. 옛날 일과 비교해 보며 조심해야 해요.","'세상에 공짜는 없다'는 말과 어울리는 행동은?":"'세상에 공짜는 없다'는 말처럼 노력하고 배우며 대가를 치를 준비를 해야 해요.","일이 잘 안 풀릴 때 알맞은 태도는?":"일이 안 풀릴 때 남 탓만 하면 달라지지 않아요. 내가 바꿀 수 있는 것을 찾으면 앞으로 나아가요.","돈을 소중하게 대하는 마음이 왜 중요할까요?":"돈을 소중히 여겨야 함부로 쓰지 않고 잘 모아요.","돈이 모이기 시작할 때 가장 필요한 것은?":"돈이 모이기 시작할 때 가장 필요한 것은 꾸준함과 계획이에요.","재능이 없어도 오래 이어 가면 어떻게 될까요?":"재능이 없어도 오래 이어 가면 눈에 띄는 때가 와요. 끈기가 재능을 이겨요.","나를 누구와 비교하면 마음이 더 편할까요?":"어제의 나와 비교하면 나아진 점이 보여서 마음이 편하고 도움이 돼요.","실패했을 때 가장 좋은 생각은?":"실패는 배움이에요. 쓸 만한 것을 챙겨서 다시 해 보면 성장해요.","내가 자는 동안에도 돈이 늘어나는 '시스템'의 예는?":"이자가 붙는 저금통처럼 스스로 늘어나는 것은 내가 자는 동안에도 일해요. 이것이 일하는 돈이에요.","'넛지'는 어떤 뜻일까요?":"넛지는 억지로 시키지 않고 살짝 쿡 찔러서 좋은 선택을 돕는 방법이에요. 예: 저금통을 눈에 띄는 곳에 두기.","저금통을 눈에 잘 띄는 곳에 두는 것은 무엇을 이용한 걸까요?":"눈에 잘 띄면 자꾸 보게 되어 저금하고 싶은 마음이 생겨요. 이것이 눈에 보이는 것에 끌리는 마음을 이용한 거예요.","경매에서 이긴 사람이 오히려 손해를 볼 때가 있는 이유는?":"경매에서 이기려고 가치보다 높은 값을 부르면 이겨도 손해예요. 이긴 사람이 오히려 손해를 보는 것을 '승자의 저주'라고 해요.","돈이나 시간이 너무 모자라면 생각은 어떻게 될까요?":"돈이나 시간이 모자라면 눈앞의 걱정에만 매달려 멀리 보기 어려워져요.","그래서 평소에 필요한 것은?":"미리 여유를 만들어 두면 마음이 덜 급해져서 좋은 결정을 할 수 있어요.","한 번 운이 좋아 크게 이긴 것을 본다면?":"한 번 운이 좋아서 크게 이긴 것은 실력이 아니라 운일 수도 있어요.","결과가 좋았던 이유를 말할 때 조심할 점은?":"결과가 좋았던 이유를 말할 때는 운과 실력을 나누어 생각해야 해요.","운이 많이 섞인 일은 결과만 보고 판단하면?":"운이 많이 섞인 일은 결과만 보고 판단하면 잘못 판단할 수 있어요. 과정도 함께 봐야 해요.","아주 좋은 결과 뒤에 평범한 결과가 오는 일이 많은 이유는?":"아주 좋은 결과 뒤에 평범한 결과가 오는 일이 많은 이유는 운이 섞여 있어서 평균으로 돌아가려는 경향이 있기 때문이에요.","'돈을 뜨겁게 사랑하고 차갑게 다룬다'는 뜻은?":"'돈을 뜨겁게 사랑하고 차갑게 다룬다'는 돈을 소중히 여기되 감정에 휘둘리지 않고 침착하게 다룬다는 뜻이에요.","남들이 들떠서 모두 살 때 필요한 태도는?":"남들이 들떠서 모두 살 때는 분위기에 휩쓸리면 비싸게 살 수 있어요. 차분히 내 계획을 지켜요.","개미와 베짱이 이야기에서 배울 수 있는 힘은?":"개미는 여름에 열심히 일해서 겨울을 준비했고 베짱이는 놀다가 겨울에 굶었어요. 지금 참고 준비하는 힘이 '만족 지연'이에요.","눈앞의 작은 보상을 더 좋아하는 마음을 뭐라고 할까요?":"눈앞의 작은 보상을 더 좋아하는 마음이 '현재 편향'이에요. 저축이 어려운 이유 중 하나예요.","사람은 항상 계산만 하고 선택할까요?":"사람은 계산만 하고 선택하지 않아요. 마음과 습관도 선택에 영향을 줘요.","어제 한 일은 오늘의 나에게 무엇일까요?":"어제 한 일은 오늘의 나를 만든 원인이에요. 오늘 잘 선택하면 내일의 내가 달라져요.","내일의 나를 바꾸고 싶으면 언제부터 바꿔야 할까요?":"바꾸고 싶으면 지금 오늘부터 시작해야 해요. 내일로 미루면 계속 미루게 돼요.","돈을 아끼는 사람은 돈을 쓸 줄 몰라서일까요?":"돈을 아끼는 사람은 쓸 줄 알아서 꼭 필요한 곳에만 쓰는 사람이에요. 쓸 줄 모르는 것과는 달라요.","물건을 사기 전에 '나에게 얼마만큼 소중한지' 정해 보는 것은?":"물건을 사기 전에 나에게 얼마나 소중한지 정해 보는 것은 가치를 정해 보는 거예요. 그러면 비싸게 사는 실수를 줄일 수 있어요.","'얼마까지만 쓸래' 하고 미리 기준을 정하면 좋은 점은?":"'얼마까지만 쓸래' 하고 미리 정해 두면 비싸게 사거나 충동으로 사는 실수를 줄일 수 있어요.","좋은 습관을 만들 때 먼저 해 볼 일은?":"좋은 습관을 만들 때 하지 말아야 할 일(낭비) 하나를 줄이는 것이 시작하기 쉬워요.","나와 잘 안 맞는 친구에게도 배울 점이 있을까요?":"나와 안 맞는 친구에게도 배울 점이 있어요. 좋은 점은 따라 하고 나쁜 점은 '나는 하지 말아야지' 하고 배워요.","친구 고민은 잘 풀어 주는데 내 고민은 어려울 땐?":"친구 고민은 감정이 덜 섞여 있어서 잘 풀어 줘요. 내 고민도 친구 일처럼 한 걸음 떨어져서 생각해 봐요.","'필요한 것'과 '원하는 것'을 구분하는 이유는?":"필요한 것과 원하는 것을 나누면 꼭 필요한 곳에 먼저 쓰고 쓸데없는 소비를 줄일 수 있어요.","돈을 모으는 데 더 중요한 것은?":"돈을 모을 때 버는 금액보다 쓰는 돈을 잘 관리하는 것이 더 중요해요. 많이 벌어도 다 쓰면 남지 않아요.","친구의 멋진 모습이 부러울 때 알맞은 생각은?":"친구의 멋진 모습은 일부분일 뿐이에요. 내 인생에 집중하면 마음이 편해져요.","매일 먹는 밥과 따뜻한 집에 대한 알맞은 마음은?":"매일 먹는 밥과 따뜻한 집은 당연한 것이 아니라 누군가의 노력 덕분이에요. 소중하게 생각하고 감사해요.","작은 행복을 더 많이 느끼는 방법은?":"하루에 감사한 일을 하나씩 떠올리면 작은 행복을 더 많이 느낄 수 있어요.","'진인사대천명'처럼 노력하고 결과를 기다리는 마음은 왜 좋을까요?":"최선을 다했으면 결과가 어떻든 마음이 편해요. 이것이 진인사대천명이에요.","친구가 새 신발을 자랑해요. 부럽지만 알맞은 마음은?":"부러운 마음은 괜찮아요. 하지만 나와 비교하지 않고 내 것에 고마워하면 마음이 편해져요.","사진 속 친구의 멋진 모습을 보고 내 삶이 부족하다고 느껴질 때는?":"사진은 좋은 순간만 보여 줘요. 그래서 남의 삶이 더 좋아 보이는 거예요.","나와 친구의 용돈이 다를 때 알맞은 생각은?":"집마다 사정이 달라서 용돈도 달라요. 내 용돈을 잘 쓰는 것이 중요해요.","누구와 비교할 때 마음이 편하고 도움이 될까요?":"어제의 나와 비교하면 마음이 편하고 도움이 돼요. 나아진 점을 볼 수 있기 때문이에요.","친구가 가졌다고 '나도 꼭 사야 해'라는 마음이 들 때는?":"친구가 가졌다고 나도 꼭 사야 하는 건 아니에요. 잠깐 멈추고 '나에게 정말 필요한가?' 물어봐요.","내 인생의 속도는 다른 사람과 같아야 할까요?":"사람마다 속도가 달라요. 내 속도로 가면 돼요. 남과 같을 필요는 없어요.","친구가 시험을 더 잘 봐서 속상할 때 좋은 행동은?":"친구가 잘해서 속상해도 축하해 주고 나는 내 방법을 바꿔 보면 나도 성장해요.","돈이 있어도 꼭 필요한 곳에만 쓰는 것은 어떤 마음일까요?":"돈이 있어도 꼭 필요한 곳에만 쓰는 것은 계획이 있어서 일부러 아끼는 절약이에요.","갖고 싶은 게 있어도 돈이 모자라 못 사는 것은 어떤 상황일까요?":"갖고 싶은 게 있어도 돈이 모자라 못 사는 것은 어쩔 수 없는 상황이에요. 절약과는 다르다는 것을 알아야 해요.","돈이 있어서 아끼는 사람과 돈이 없어서 못 쓰는 사람의 가장 큰 차이는?":"아끼는 사람은 쓸지 말지 고를 수 있지만 돈이 없어서 못 쓰는 사람은 고르기 어려워요. 그 차이가 선택의 자유예요.","돈이 없어서 못 쓰는 친구를 대하는 알맞은 태도는?":"돈이 없어서 못 쓰는 친구를 놀리면 안 돼요. 마음을 이해하고 함께 즐길 방법을 찾는 것이 친구예요.","돈을 모아 나중에 더 큰 걸 하려고 지금은 참는 것은?":"나중에 더 큰 걸 하려고 지금 참는 것이 만족 지연이에요.","돈이 있어도 아끼는 습관을 가지면 좋은 점은?":"돈이 있어도 아끼는 습관이 있으면 갑자기 필요할 때나 하고 싶은 일에 쓸 수 있어요.","돈이 모자랄 때 가장 먼저 해 볼 일은?":"돈이 모자랄 때는 꼭 필요한 것부터 순서를 정하고 어른과 의논하면 해결 방법을 찾기 쉬워요.","돈은 왜 필요할까요?":"돈은 필요한 것을 사고 마음 놓고 살 수 있게 도와줘요. 하지만 돈은 목적이 아니라 도구예요.","돈이 많으면 꼭 행복할까요?":"돈은 도움이 되지만 가족, 건강, 친구도 행복에 중요해요. 돈만으로는 행복을 다 살 수 없어요.","내가 쓰는 용돈은 누가 번 돈일까요?":"용돈은 가족이 일해서 번 돈일 수 있어요. 고마운 마음으로 쓰면 소중하게 쓰게 돼요.","돈을 쓰기 전에 생각해 볼 질문으로 알맞은 것은?":"쓰기 전에 필요한가, 지금 사야 하나, 다른 방법은 없나 물어보면 충동소비를 막을 수 있어요.","어른이 되어 돈을 잘 쓰려면 지금 무엇을 연습하면 좋을까요?":"용돈을 나누고 기록하며 계획해 보는 연습이 어른이 되어 돈을 잘 쓰는 힘이 돼요.","'기회비용'과 '선택의 대가'는 어떻게 다를까요?":"기회비용은 포기한 것이고 선택의 대가는 직접 내야 하는 것이에요. 둘을 구분해서 생각해 봐요.","돈을 쓰는 데도 좋은 방법이 있을까요?":"돈은 남에게 피해를 주지 않고 나에게 도움이 되도록 쓰는 것이 좋은 방법이에요."}};

 box.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} 기록 내보내기</h2><p class="sub">아래 긴 글자(코드)를 복사해서 다른 기기의 "가져오기"에 붙여 넣어요. 도감, 점수, 기록이 들어 있어요.</p><textarea id="ec" readonly rows="6" style="width:100%;font-size:.75rem">${code}</textarea><button class="go" id="ecp" style="margin-top:8px">복사하기</button><p class="sub" id="emsg"></p><button class="opt" id="eb" style="text-align:center">돌아가기</button></div>`;
 $("ecp").onclick=()=>{$("ec").select();try{navigator.clipboard.writeText(code).then(()=>{$("emsg").textContent="복사했어요!"},()=>{$("emsg").textContent="글자를 길게 눌러 직접 복사해 주세요."})}catch(e){$("emsg").textContent="글자를 길게 눌러 직접 복사해 주세요."}};
 $("eb").onclick=back;
}
function importScreen(id,box,back){
 const p=profs().find(x=>x.id===id);if(!p)return back();
 box.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} 기록 가져오기</h2><p class="sub">다른 기기에서 내보낸 코드를 붙여 넣어요. 지금 기록은 코드의 기록으로 바뀌어요.</p><textarea id="ic" rows="6" style="width:100%;font-size:.75rem"></textarea><button class="go" id="iok" style="margin-top:8px">가져오기</button><p class="sub" id="imsg"></p><button class="opt" id="ib" style="text-align:center">돌아가기</button></div>`;
 let sure=false;
 $("iok").onclick=()=>{let o;try{o=dec($("ic").value)}catch(e){o=null}
  if(!o||o.app!=="chagok"||!o.s){sure=false;$("imsg").textContent="코드가 올바르지 않아요. 다시 확인해 주세요.";return}
  if(!sure){sure=true;$("imsg").textContent="지금 기록이 바뀌어요. 한 번 더 누르면 가져와요.";return}
  ls("chagok_d_"+id,JSON.stringify(o.s));ls("chagok_w_"+id,JSON.stringify(o.w||[]));
  if(id===CUR){S=Object.assign(defS(),o.s);normalize();save()}
  $("imsg").textContent="가져왔어요!";setTimeout(back,800)};
 $("ib").onclick=back;
}
function showProfMenu(){
 const p=$("play"),m=me();if(!m)return showStart();$("home").classList.add("hide");p.classList.remove("hide");
 p.innerHTML=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.1rem">${esc(m.name)}님의 프로필</h2><button class="opt" id="pe" style="text-align:center">내 기록 내보내기</button><button class="opt" id="pi" style="text-align:center">내 기록 가져오기</button><button class="opt" id="po" style="text-align:center">다른 프로필로 (나가기)</button><button class="go" id="ph" style="margin-top:10px">처음으로</button></div>`;
 $("pe").onclick=()=>exportScreen(CUR,$("play"),showProfMenu);$("pi").onclick=()=>importScreen(CUR,$("play"),showProfMenu);$("po").onclick=showStart;$("ph").onclick=showHome;
}
$("profbtn").onclick=showProfMenu;
function profPin(id){
 const p=profs().find(x=>x.id===id);if(!p)return sview();
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} PIN 바꾸기</h2><p class="sub">예전 PIN을 몰라도 새 PIN으로 바꿀 수 있어요.</p><label for="q1">새 PIN (숫자 4자리)</label><input id="q1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><label for="q2">한 번 더</label><input id="q2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="go" id="qok" style="margin-top:10px">바꾸기</button><p class="sub" id="qm"></p><button class="opt" id="qb" style="text-align:center">설정으로</button></div>`;
 $("qb").onclick=sview;
 $("qok").onclick=()=>{const a=$("q1").value,b=$("q2").value;
  if(!/^\d{4}$/.test(a)){$("qm").textContent="숫자 4자리로 입력해 주세요.";return}
  if(a!==b){$("qm").textContent="두 번 입력한 PIN이 달라요.";return}
  const L=profs();L.find(x=>x.id===id).pin=a;setProfs(L);$("qm").textContent="바꿨어요!";setTimeout(sview,800)};
}
function deleteProfile(id){
 setProfs(profs().filter(p=>p.id!==id));
 try{["chagok_d_","chagok_w_","chagok_prog_"].forEach(k=>localStorage.removeItem(k+id))}catch(e){}
}
function closeProf(){CUR=null;S=defS();sview()}
function sview(){
 const L=profs();
 const prof=L.length?L.map(p=>`<div class="note"><b>${esc(p.name)}</b><button class="opt" data-a="open" data-id="${p.id}" style="text-align:center;margin-top:6px">이 프로필 설정·기록 열기</button><button class="opt" data-a="wk" data-id="${p.id}" style="text-align:center">📊 주간 공부 요약 보기</button><button class="opt" data-a="exp" data-id="${p.id}" style="text-align:center">내보내기</button><button class="opt" data-a="imp" data-id="${p.id}" style="text-align:center">가져오기</button><button class="opt" data-a="del" data-id="${p.id}" style="text-align:center">프로필 삭제</button></div>`).join(""):"<p>아직 프로필이 없어요. 첫 화면에서 만들어요.</p>";
 $("parent").classList.remove("hide");
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">🔒 설정</h2>`+det("g1","공부 자료",matHtml())+det("g2","프로필 관리",prof)+det("g4","몬스터·마을 전체 보기",`<p class="sub">도감에 없는 몬스터도 모두 볼 수 있어요. (게임 기록에는 영향이 없어요)</p><button class="opt" id="pam" style="text-align:center">몬스터 100마리 전체 보기</button><button class="opt" id="pav" style="text-align:center">마을 전체 보기</button>`)+det("g3","부모 PIN",`<button class="opt" id="ppin" style="text-align:center">부모 PIN 번호 바꾸기</button>`)+`<button class="go" id="pback">◀ 이전</button></div>`;
 $("parent").querySelectorAll("details").forEach(d=>d.ontoggle=()=>{d.open?OP.add(d.dataset.k):OP.delete(d.dataset.k)});
 const go=f=>()=>{$("parent").classList.add("hide");f()};
 $("pam").onclick=go(()=>showAllMon(false));$("pav").onclick=go(()=>showAllVil(3));$("pst").onclick=go(()=>showStudy(0,STUDY,toSettings));$("pbq").onclick=go(showBookList);$("pbk").onclick=go(showBooks);$("pk").onclick=go(showKinds);$("pdel").onclick=go(showDeleted);$("ppin").onclick=pchange;$("pback").onclick=pclose;
 const del={};
 $("parent").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.a;
  if(a=="open"){loadProfile(id);pview()}
  else if(a=="wk"){loadProfile(id);showWeekly(0)}
  else if(a=="pin")profPin(id);
  else if(a=="exp")exportScreen(id,$("parent"),sview);
  else if(a=="imp")importScreen(id,$("parent"),sview);
  else if(a=="del"){if(!del[id]){del[id]=1;b.textContent="정말 지울까요? 한 번 더 눌러요";return}deleteProfile(id);sview()}});
}

function showAllMon(ev,sel){
 const p=$("play");$("home").classList.add("hide");p.classList.remove("hide");
 const cur=sel?M.find(x=>x.id===sel):null;
 p.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">몬스터 전체 ${M.length}마리</h2><p class="sub">부모님용 전체 보기예요. 누르면 설명이 나와요.</p>
 <div style="display:flex;gap:8px;margin:8px 0"><button class="${ev?"opt":"go"}" id="am0" style="flex:1;margin:0">기본 모습</button><button class="${ev?"go":"opt"}" id="am1" style="flex:1;margin:0">변신 모습</button></div>
 <div class="note" id="aminfo">${cur?`<b>${ev?cur.v:cur.n}</b> · ${cur.r}<br>${cur.d}`:"몬스터를 눌러 보세요."}</div>`
 +RK.map(r=>`<div class="day" style="color:${R[r].c}">${r} · ${M.filter(m=>m.r===r).length}마리</div><div class="cv" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${M.filter(m=>m.r===r).map(m=>`<div data-id="${m.id}" role="button" tabindex="0" style="text-align:center;border:2px solid ${R[r].c};border-radius:10px;padding:4px 0;background:var(--bg);cursor:pointer"><div style="line-height:0">${art(m,ev,56)}</div><div style="font-size:.7rem">${ev?m.v:m.n}</div></div>`).join("")}</div>`).join("")
 +`<div style="display:flex;gap:8px;margin-top:14px"><button class="opt" id="amb" style="flex:1;text-align:center;margin:0">◀ 이전</button><button class="go" id="amh" style="flex:1">처음으로</button></div></div>`;
 $("am0").onclick=()=>showAllMon(false);$("am1").onclick=()=>showAllMon(true);
 $("amb").onclick=toSettings;$("amh").onclick=showHome;
 p.querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{const m=M[+e.dataset.id-1];$("aminfo").innerHTML=`<b>${ev?m.v:m.n}</b> · ${m.r}<br>${m.d}`});
}
function showAllVil(lv){
 const p=$("play");$("home").classList.add("hide");p.classList.remove("hide");
 const bld={};BT.forEach(b=>bld[b.k]=lv);
 const pick=M.filter((m,i)=>i%9===0).slice(0,12);
 p.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">마을 전체 보기</h2><p class="sub">모든 건물을 한꺼번에 지은 모습이에요. (내 마을 기록에는 영향이 없어요)</p>
 <div style="display:flex;gap:6px;margin:8px 0">${[1,2,3].map(n=>`<button class="${n===lv?"go":"opt"}" data-lv="${n}" style="flex:1;margin:0;padding:8px 4px">Lv.${n}</button>`).join("")}</div>
 <div style="position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden">${sceneSVG(bld,false)}${pick.map((m,i)=>`<div style="position:absolute;left:${3+(i*29)%72}%;top:${46+(i*7)%26}%;text-align:center;line-height:0">${art(m,false,50)}</div>`).join("")}</div>
 <div class="day">건물 목록</div>${BT.map(t=>`<div class="note"><b>${t.n}</b><br><span class="sub">${t.d}</span></div>`).join("")}
 <div style="display:flex;gap:8px;margin-top:14px"><button class="opt" id="avb" style="flex:1;text-align:center;margin:0">◀ 이전</button><button class="go" id="avh" style="flex:1">처음으로</button></div></div>`;
 p.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>showAllVil(+b.dataset.lv));
 $("avb").onclick=toSettings;$("avh").onclick=showHome;
}
function pgate(){
 const has=lg(PK);
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">🔒 설정</h2><p class="sub">${has?"PIN 4자리를 입력해 주세요.":"처음이에요. 부모님이 쓸 숫자 4자리 PIN을 정해 주세요."}</p><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="go" id="pok" style="margin-top:10px">${has?"확인":"PIN 정하기"}</button><p class="sub" id="pmsg"></p><button class="opt" id="pback" style="text-align:center">돌아가기</button></div>`;
 $("pback").onclick=pclose;
 $("pok").onclick=()=>{const v=$("pin").value;
  if(!/^\d{4}$/.test(v)){$("pmsg").textContent="숫자 4자리로 입력해 주세요.";return}
  if(!has){ls(PK,v);sview();return}
  if(v===has)sview();else $("pmsg").textContent="PIN이 달라요.";};
}
showStart();
</script>
